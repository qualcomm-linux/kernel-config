# qcom-next SHA-pinned topic configuration
#
# SINGLE SOURCE OF TRUTH for the content of the qcom-next integration tree.
#
#   qcom-next = f( base.sha , ordered topics[].sha , rerere cache revision )
#
# Rules:
#   * qcom-next is never hand-edited. It is published only by the
#     publication workflow, driven by this file.
#   * Every entry carries a concrete sha. There is no 'sha: null', and
#     generation never falls back to a branch tip (FR-INT-03).
#   * Every sha recorded here is a STABLE sha: it has passed the CI gates.
#   * Every sha must be reachable from a tag so it survives a topic rebase.
#   * Topic owners live in topic_maintainers.json, keyed by the topic name
#     below. Do not duplicate owner data here.
#   * Array order IS merge order and must respect depends_on.
#
# To promote a topic: open a PR changing only that topic's sha and tag.
# To uprev the kernel RC: open a PR changing only the base block.
# Validated by scripts/validate_qcom_next_config.py against
# schemas/qcom-next.schema.json.
#
# Bootstrapped from qcom-next.conf on 2026-10-18 by
# scripts/bootstrap_qcom_next_yaml.py.
#
# Topic SHAs were taken from the automerge topic_SHA1 table at
#   https://raw.githubusercontent.com/qualcomm-linux/kernel/qcom-next/qcom-next/topic_SHA1
# so this config describes an integration state that was actually
# built, rather than whatever the branch tips happened to be.
# 50 topic(s) pinned from that table.
#
# 28 topic(s) from qcom-next.conf are NOT listed
# here. They are absent from the table, meaning that run reported
# "Already up to date" for them and they contributed no commits, so
# excluding them produces the same tree. Each should be re-added,
# pinned and tagged, by its next promotion. Some may also have been
# deleted upstream, in which case they should stay out:
#   - tech/bsp/ec
#   - tech/mem/secure-buffer
#   - tech/debug/soc
#   - tech/bus/pci/mhi
#   - tech/bus/pci/phy
#   - tech/bus/pci/pwrctl
#   - tech/bus/usb/gadget
#   - tech/debug/eud
#   - tech/debug/rdbg
#   - tech/pmic/backlight
#   - tech/pmic/mfd
#   - tech/pmic/regulator
#   - tech/pmic/supply
#   - tech/mm/audio/soundwire
#   - tech/mm/phy
#   - tech/mproc/rpmsg
#   - tech/mproc/qmi
#   - tech/net/eth
#   - tech/net/rmnet
#   - tech/net/qrtr
#   - tech/net/phy
#   - tech/pm/opp
#   - tech/security/fscrypt
#   - tech/storage/nvmem
#   - tech/storage/phy
#   - tech/virt/gunyah
#   - tech/all/maili
#   - tech/mproc/all
#
# NOTE: 46 topic(s) had no tag pointing at the captured tip at
# bootstrap time and carry 'tag: null'. Each must be tagged
# (<branch>-<kernel-version>-<YYYYMMDD>) before it can be promoted; the
# validator rejects a null tag unless --allow-untagged is passed.

schema_version: 1

# Upstream baseline. Changed only by an RC uprev PR (Phase A), which must
# leave every topic sha untouched.
base:
  repo: "https://github.com/qualcomm-linux-stg/kernel.git"
  branch: qcom-next-staging
  tag: null
  sha: 93f51579e7df248780214094418f205253383cc5

# open   = topic promotions may publish
# frozen = RC uprev in progress; promotions may validate but not publish
promotion_state: open

# Shared rerere cache replayed during tree generation. Read-only in normal
# PR CI; updated by a topic maintainer only when resolving a conflict.
rerere_cache:
  repo: "https://github.com/sgaud-quic/cache"
  ref: master

