name: AWS S3 Helper
description: Upload and download files from AWS S3

inputs:
  s3_bucket:
    description: S3 Bucket Name
    required: true
  local_file:
    description: Local file paths
    required: false
    default: ../artifacts/file_list.txt
  download_file:
    description: Download file paths
    required: false
    default: ''
  download_location:
    description: file download location
    required: false
    default: .
  mode:
    description: Mode of operation (upload/download)
    required: true
    default: single-upload
  upload_location:
    description: Upload location
    required: false
    default: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.run_id }}-${{ github.run_attempt }}
  artifact_url_base:
    description: HTTPS endpoint serving uploaded S3 artifacts
    required: false
    default: https://qli-prod-artifacts.qualcomm.com

outputs:
  presigned_url:
    description: Direct artifact URL for the uploaded file
    value: ${{ steps.sync-data.outputs.presigned_url }}
  s3_location:
    description: Upload location
    value: ${{ inputs.upload_location }}

runs:
  using: "composite"
  steps:
    - name: Sync Data
      id: sync-data
      shell: bash
      env:
        UPLOAD_LOCATION: ${{ inputs.upload_location }}
        ARTIFACT_URL_BASE: ${{ inputs.artifact_url_base }}
      run: |
        echo "::group::$(printf '__________ %-100s' 'Process' | tr ' ' _)"
        build_artifact_url() {
          local object_key="$1"
          local encoded_object_key

          encoded_object_key="$(python3 -c 'from urllib.parse import quote; import sys; print(quote(sys.argv[1], safe="/"))' "$object_key")"
          printf '%s/%s/%s\n' "${ARTIFACT_URL_BASE%/}" "${{ inputs.s3_bucket }}" "$encoded_object_key"
        }

        case "${{ inputs.mode }}" in
          multi-upload)
            echo "Uploading files to S3 bucket..."
            manifest="${{ github.workspace }}/presigned_urls.json"
            # Keep the existing manifest name while storing direct artifact URLs.
            echo '{}' > "$manifest"
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "Uploading $file..."
                aws s3 cp "$file" s3://${{ inputs.s3_bucket }}/${{ env.UPLOAD_LOCATION }}/
                echo "Uploaded $file to s3://${{ inputs.s3_bucket }}/${{ env.UPLOAD_LOCATION }}"
                filename=$(basename "$file")
                artifact_url=$(build_artifact_url "${UPLOAD_LOCATION%/}/$filename")
                jq --arg file "$file" --arg url "$artifact_url" '. + {($file): $url}' "$manifest" > "${manifest}.tmp"
                mv "${manifest}.tmp" "$manifest"
                echo "Artifact URL for $file: $artifact_url"
              else
                echo "Warning: $file does not exist or is not a regular file."
              fi
            done < "${{ inputs.local_file }}"
            ;;
          single-upload)
            echo "Uploading single file to S3 bucket..."
            aws s3 cp "${{ inputs.local_file }}" s3://${{ inputs.s3_bucket }}/${{ env.UPLOAD_LOCATION }}/
            echo "Uploaded ${{ inputs.local_file }} to s3://${{ inputs.s3_bucket }}/${{ env.UPLOAD_LOCATION }}"
            filename=$(basename "${{ inputs.local_file }}")
            artifact_url=$(build_artifact_url "${UPLOAD_LOCATION%/}/$filename")
            echo "presigned_url=${artifact_url}" >> "$GITHUB_OUTPUT"
            echo "Artifact URL for ${{ inputs.local_file }}: $artifact_url"
            ;;
          download)
            #Download The required file from s3
            echo "Downloading files from S3 bucket..."
            location=${{ inputs.download_location }}
            download_dir=$(realpath "$location")
            echo "Downloading ${{ inputs.download_file }} at ==> ${download_dir}"
            aws s3 cp s3://${{ inputs.s3_bucket }}/${{ inputs.download_file }} "$download_dir"
            echo "Downloaded ${{ inputs.download_file }} to $download_dir"
            ;;
          *)
            echo "Invalid mode. Use 'upload' or 'download'."
            exit 1
            ;;
        esac
        echo "::endgroup::"

    - name: Upload artifacts
      if: ${{ inputs.mode == 'multi-upload' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.machine }}presigned_urls.json
        path: ${{ github.workspace }}/presigned_urls.json
        retention-days: 3
