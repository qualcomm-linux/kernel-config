---
name: Load Parameters
description: Load parameters for the build job

inputs:
  branch:
    description: Target branch used to filter test targets
    required: false
    default: ""

  build_type:
    description: >
      Build type used to filter test targets (kbdev or yocto). Targets opt out
      by listing only the wanted types in "build_types" in ci/MACHINES.json.
      Targets without "build_types" are enabled for every build type.
    required: false
    default: ""

  repo:
    description: >
      Target repository. Branches of qualcomm-linux/kernel-topics are topic
      branches and take their test enablement from ci/TOPIC_BRANCHES.json.
    required: false
    default: ""

outputs:
  build_matrix:
    description: Build matrix
    value: ${{ steps.set-matrix.outputs.build_matrix }}

  full_matrix:
    description: full matrix containing lava devails
    value: ${{ steps.set-matrix.outputs.full_matrix }}

  bootbins:
    description: Boot Bins for targets to generate Flat Build
    value: ${{ steps.set-matrix.outputs.bootbins }}

  ubuntu_matrix:
    description: Ubuntu matrix for generating packages
    value: ${{ steps.ubuntu-matrix.outputs.ubuntu_matrix }}

  rootfs_matrix:
    description: Rootfs matrix for Yocto
    value: ${{ steps.set-matrix.outputs.rootfs_matrix }}

  lava_enabled:
    description: Whether LAVA tests are enabled for the branch
    value: ${{ steps.set-matrix.outputs.lava_enabled }}

  axiom_enabled:
    description: Whether Axiom tests are enabled for the branch
    value: ${{ steps.set-matrix.outputs.axiom_enabled }}

runs:
  using: "composite"
  steps:
    - name: Set Build Matrix
      id: set-matrix
      uses: actions/github-script@v7
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_BUILD_TYPE: ${{ inputs.build_type }}
        INPUT_REPO: ${{ inputs.repo }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const targetsPath = path.join(process.env.GITHUB_WORKSPACE, 'ci', 'MACHINES.json');
          let targets;
          try {
            if (!fs.existsSync(targetsPath)) {
              core.setFailed(`MACHINES.json not found at ${targetsPath}`);
              return;
            }
            targets = JSON.parse(fs.readFileSync(targetsPath, 'utf-8'));
          } catch (err) {
            core.setFailed(`Failed to load or parse MACHINES.json: ${err.message}`);
            return;
          }
          // Build matrix: machine, firmware
          const build_matrix = Object.values(targets)
            .filter(({ lavaname }) => lavaname && lavaname.trim() !== '')
            .map(({ machine, firmware }) => ({ machine, firmware }));
          core.setOutput('build_matrix', JSON.stringify(build_matrix));
          console.log("Build Matrix:", build_matrix);

          // Full matrix: machine, firmware, lavaname
          const full_matrix = Object.values(targets)
            .filter(({ lavaname }) => lavaname && lavaname.trim() !== '')
            .map(({ machine, firmware, lavaname }) => ({ machine, firmware, lavaname }));
          core.setOutput('full_matrix', JSON.stringify(full_matrix));
          console.log("Full Matrix:", full_matrix);

          // Bootbins: target, buildid, firmwareid
          const bootbins = Object.values(targets).map(({ target, buildid, firmwareid }) => ({ target, buildid, firmwareid }));
          core.setOutput('bootbins', JSON.stringify(bootbins));
          console.log("Boot Bins:", bootbins);

          // rootfs matrix: machine, rootfs
          const inputBranch = process.env.INPUT_BRANCH || "";
          const branch = inputBranch.startsWith('qcom-next-candidate') ? 'qcom-next-staging' : inputBranch;
          if (inputBranch !== branch) {
            console.log(`Using ${branch} matrix for candidate branch ${inputBranch}`);
          }
          // Topic branches live in qualcomm-linux/kernel-topics, and any branch
          // MACHINES.json does not list is treated as one as well. They build on
          // every target and only run tests when ci/TOPIC_BRANCHES.json enables
          // them. Release branches keep their per-target "branches" filter.
          const releaseBranches = new Set();
          for (const { branches } of Object.values(targets)) {
            (branches || []).forEach((name) => releaseBranches.add(name));
          }
          const isTopicRepo = (process.env.INPUT_REPO || "") === 'qualcomm-linux/kernel-topics';
          const isReleaseBranch = !isTopicRepo && (!branch || releaseBranches.has(branch));

          // A target without "build_types" stays enabled for every build type.
          const buildType = (process.env.INPUT_BUILD_TYPE || "").toLowerCase();
          const rootfs_matrix = Object.values(targets)
            .filter(({ rootfs }) => rootfs && rootfs.trim() !== '')
            .filter(({ branches }) => !isReleaseBranch || !branch || !branches || branches.includes(branch))
            .filter(({ build_types }) => !buildType || !build_types || build_types.includes(buildType))
            .map(({ machine, rootfs, firmwareid, lavaname, flash_type, hypervisor, storage }) => ({
              machine,
              rootfs,
              firmwareid,
              lavaname,
              flash_type,
              hypervisor,
              storage: storage || 'ufs'
            }));
          core.setOutput('rootfs_matrix', JSON.stringify(rootfs_matrix));
          console.log("Rootfs Matrix:", rootfs_matrix);

          // Test enablement: release branches keep LAVA and Axiom enabled, topic
          // branches opt in through ci/TOPIC_BRANCHES.json and build only by
          // default.
          const topicConfigPath = path.join(process.env.GITHUB_WORKSPACE, 'ci', 'TOPIC_BRANCHES.json');
          let topicBranches = {};
          if (fs.existsSync(topicConfigPath)) {
            try {
              topicBranches = JSON.parse(fs.readFileSync(topicConfigPath, 'utf-8'));
            } catch (err) {
              core.setFailed(`Failed to parse TOPIC_BRANCHES.json: ${err.message}`);
              return;
            }
          }
          const topicConfig = topicBranches[branch] || {};
          const lavaEnabled = isReleaseBranch || topicConfig.lava === true;
          const axiomEnabled = isReleaseBranch || topicConfig.axiom === true;
          core.setOutput('lava_enabled', String(lavaEnabled));
          core.setOutput('axiom_enabled', String(axiomEnabled));
          console.log(`Branch ${branch || '(none)'}: release=${isReleaseBranch} lava=${lavaEnabled} axiom=${axiomEnabled}`);

    - name: Set Ubuntu Config Matrix
      id: ubuntu-matrix
      if: ${{ github.workflow == 'pre_merge_ubuntu' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const ubuntuConfigPath = path.join(process.env.GITHUB_WORKSPACE, 'ci', 'UBUNTU_CONFIG.json');
          let ubuntuConfig;
          try {
            if (!fs.existsSync(ubuntuConfigPath)) {
              core.setFailed(`UBUNTU_CONFIG.json not found at ${ubuntuConfigPath}`);
              return;
            }
            ubuntuConfig = JSON.parse(fs.readFileSync(ubuntuConfigPath, 'utf-8'));
          } catch (err) {
            core.setFailed(`Failed to load or parse UBUNTU_CONFIG.json: ${err.message}`);
            return;
          }
          // Build matrix: os, kernel, firmware
          const ubuntu_matrix = Object.values(ubuntuConfig).map(obj => Object.fromEntries(Object.entries(obj)));
          core.setOutput('ubuntu_matrix', JSON.stringify(ubuntu_matrix));
          console.log("Ubuntu Matrix:", ubuntu_matrix); 
