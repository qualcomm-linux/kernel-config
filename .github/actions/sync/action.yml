name: Sync workspace

inputs:
  base_branch:
    description: Base branch
    required: true
    default: qcom-next-staging
  pr_number:
    description: PR number
    required: false
  sha:
    description: Head sha of the PR
    required: false
  GH_TOKEN:
    description: Access Token
    required: true
  repo:
    description: repo
    required: true

outputs:
  workspace_path:
    description: Sync workspace path
    value: ${{ steps.set-workspace.outputs.workspace }}

runs:
  using: "composite"
  steps:
    - name: Clean workspace
      shell: bash
      run: |
        echo "Cleaning up workspace..."
        rm -rf ${{ github.workspace }}/*
        echo "Workspace cleaned successfully!"

    - name: Checkout PR branch
      if: inputs.repo == 'qualcomm-linux/kernel'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        repository: qualcomm-linux/kernel
        ref: ${{ inputs.base_branch }}

    - name: Configure git
      shell: bash
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

    - name: Sync with latest changes
      if: inputs.repo == 'qualcomm-linux/kernel'
      shell: bash
      run: |
        set -e
        echo "Syncing with latest changes..."
        git fetch origin ${{ inputs.base_branch }}
        git merge --no-ff origin/${{ inputs.base_branch }}

    - name: Clone repositories
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        git clone https://github.com/qualcomm-linux/kernel-topics.git kernel
        git clone https://github.com/qualcomm-linux/automerge.git

    - name: Create full automerge configuration
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        config_file="$GITHUB_ACTION_PATH/../../../qcom-next.conf"
        if [ ! -f "$config_file" ]; then
          echo "ERROR: qcom-next.conf not found at $config_file"
          exit 1
        fi

        mkdir -p kernel-config
        awk '
          $1 == "baseline" {
            print "baseline https://github.com/qualcomm-linux/kernel-topics.git baseline"
            next
          }
          { print }
        ' "$config_file" > kernel-config/qcom-next.conf

        echo "File 'kernel-config/qcom-next.conf' created successfully for full automerge from kernel-topics/baseline."
        cat kernel-config/qcom-next.conf

    - name: Run full automerge
      id: automerge
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        set -e
        cd kernel
        ../automerge/ci-merge -f ../kernel-config/qcom-next.conf -t head -i qcom-next -c https://github.com/sgaud-quic/cache -n | tee ../merge.log

    - name: Fetch PR
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        set -e
        cd kernel
        git fetch https://github.com/qualcomm-linux/kernel-topics.git pull/${{inputs.pr_number}}/head:pr-${{inputs.pr_number}}

        pr_sha=$(git rev-parse pr-${{inputs.pr_number}})
        if [ "$pr_sha" != "${{ inputs.sha }}" ]; then
          echo "ERROR: fetched PR head $pr_sha does not match requested SHA ${{ inputs.sha }}"
          exit 1
        fi

        git merge pr-${{inputs.pr_number}} --no-commit
        if ! git diff --cached --quiet; then
          git commit -m "Merged PR #${{inputs.pr_number}} after full automerge"
        else
          echo "Nothing to commit. PR may already be included in the full automerge tree."
        fi

    - name: Fetch PR
      if: inputs.repo == 'qualcomm-linux/kernel'
      shell: bash
      run: |
        git checkout ${{ inputs.base_branch }}
        git fetch https://github.com/qualcomm-linux/kernel.git pull/${{inputs.pr_number}}/head:pr-${{inputs.pr_number}}
        git merge pr-${{ inputs.pr_number }} --no-commit || echo "Merge already applied or fast-forwarded"
        if ! git diff --cached --quiet; then
          git commit -m "Merged PR #${{ inputs.pr_number }}"
        else
          echo "Nothing to commit. PR may already be merged or fast-forwarded."
        fi

    - name: Set workspace path
      id: set-workspace
      shell: bash
      run: |
        if [[ "${{ inputs.repo }}" == "qualcomm-linux/kernel" ]]; then
          echo "workspace=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
        else
          echo "workspace=${{ github.workspace }}/kernel" >> "$GITHUB_OUTPUT"
        fi
