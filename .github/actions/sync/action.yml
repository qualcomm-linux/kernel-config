name: Sync workspace

inputs:
  base_branch:
    description: Branch or ref to check out
    required: true
    default: qcom-next-staging
  pr_number:
    description: PR number to merge. Leave empty or 0 to check out base_branch as-is.
    required: false
  GH_TOKEN:
    description: Access Token
    required: true
  repo:
    description: repo
    required: true

outputs:
  workspace_path:
    description: Sync workspace path
    value: ${{ steps.set-workspace.outputs.workspace }}

runs:
  using: "composite"
  steps:
    - name: Clean workspace
      shell: bash
      run: |
        echo "Cleaning up workspace..."
        rm -rf "${{ github.workspace }}/kernel" "${{ github.workspace }}/automerge"
        echo "Workspace cleaned successfully!"

    - name: Classify sync mode
      id: mode
      shell: bash
      env:
        IN_REPO: ${{ inputs.repo }}
        IN_PR: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail

        if [ "$IN_REPO" = "qualcomm-linux/kernel-topics" ]; then
          mode=topics
        elif [ -z "$IN_PR" ] || [ "$IN_PR" = "0" ]; then
          mode=ref
        else
          mode=pr
        fi

        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "Sync mode: $mode"

    - name: Checkout PR branch
      if: steps.mode.outputs.mode != 'topics'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.base_branch }}
        path: kernel
        token: ${{ inputs.GH_TOKEN }}

    - name: Configure git
      shell: bash
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

    - name: Sync with latest changes
      if: steps.mode.outputs.mode == 'pr'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -e
        echo "Syncing with latest changes..."
        git fetch origin ${{ inputs.base_branch }}
        git merge --no-ff origin/${{ inputs.base_branch }}

    - name: Record the checked out commit
      if: steps.mode.outputs.mode == 'ref'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        echo "Testing ${{ inputs.repo }} at ${{ inputs.base_branch }}"
        echo "commit: $(git rev-parse HEAD)"
        git --no-pager log -1 --format='%H %s'

    - name: Clone repositories
      if: steps.mode.outputs.mode == 'topics'
      shell: bash
      run: |
        git clone https://github.com/qualcomm-linux/kernel.git
        git clone --branch sha_config_yaml https://github.com/sgaud-quic/automerge.git

    - name: Scan PR Description
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        curl -L \
        -H "Authorization: Bearer ${{ inputs.GH_TOKEN }}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/qualcomm-linux/kernel-topics/pulls/${{ inputs.pr_number }}" | \
        jq --raw-output .body > pr-desc
        cat pr-desc

    - name: Retrieve Dependencies
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        set +o pipefail
        cat pr-desc | \
        grep --perl-regexp '^Depends-on:' | \
        cut -d ':' -f2 | \
        tr ',' '\n' | \
        sed 's/^ *//' | \
        sed 's/ *$//' | \
        sed 's/^#//' | \
        sed '/^$/d' > pr-deps
        cat pr-deps

    - name: Validate Dependencies
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
      shell: bash
      run: |
        touch topic-branches
        touch invalid-deps
        base_pr=${{ inputs.pr_number }}

        while read -r dep; do
          [ -z "$dep" ] && continue

          if [[ "$dep" =~ ^[0-9]+$ ]]; then
            resp=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/qualcomm-linux/kernel-topics/pulls/$dep")
            if echo "$resp" | jq -e ".merged_at != null" > /dev/null; then
              base_ref=$(echo "$resp" | jq -r .base.ref)
              echo "$dep,$base_ref" >> topic-branches
            else
              echo "#$dep" >> invalid-deps
            fi
          elif git ls-remote --exit-code --heads https://github.com/qualcomm-linux/kernel-topics.git "$dep" > /dev/null 2>&1; then
            echo "$dep,$dep" >> topic-branches
          else
            echo "#$dep" >> invalid-deps
          fi
        done < pr-deps

        if [ -s "topic-branches" ]; then
          sort -t, -k2,2 -u topic-branches -o topic-branches
        fi

        if [ -s "invalid-deps" ]; then
            msg="CI build failed due to invalid or unmerged dependencies: $(paste -sd ' ' < invalid-deps)"
            json=$(jq -n --arg body "$msg" '{body: $body}')
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/qualcomm-linux/kernel-topics/issues/"$base_pr"/comments \
            -d "$json"
            exit 1
        fi
        cat topic-branches

    - name: Create qcom-next YAML for topic PR
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        set -euo pipefail
        topic_branch="${{ inputs.base_branch }}"
        config_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        config_in="$config_root/qcom-next.yaml"
        config_out="$GITHUB_WORKSPACE/qcom-next-pr.yaml"

        topics_file="$GITHUB_WORKSPACE/topic-overrides.txt"
        printf '%s\n' "$topic_branch" > "$topics_file"
        if [ -s topic-branches ]; then
          cut -d, -f2 topic-branches >> "$topics_file"
        fi
        sort -u "$topics_file" -o "$topics_file"

        deps_file="$GITHUB_WORKSPACE/topic-dependencies.json"
        if [ -s topic-branches ]; then
          cut -d, -f2 topic-branches | sort -u | jq -R . | jq -s . > "$deps_file"
        else
          jq -n '[]' > "$deps_file"
        fi

        : > "$GITHUB_WORKSPACE/topic-override-shas.jsonl"
        while IFS= read -r override_branch; do
          [ -z "$override_branch" ] && continue
          override_sha="$(git ls-remote https://github.com/qualcomm-linux/kernel-topics.git "refs/heads/${override_branch}" | awk '{print $1}')"
          if [ -z "$override_sha" ]; then
            echo "ERROR: topic branch '${override_branch}' was not found in qualcomm-linux/kernel-topics" >&2
            exit 1
          fi
          jq -n --arg branch "$override_branch" --arg sha "$override_sha" '{($branch): $sha}' >> "$GITHUB_WORKSPACE/topic-override-shas.jsonl"
        done < "$topics_file"
        jq -s 'add' "$GITHUB_WORKSPACE/topic-override-shas.jsonl" > "$GITHUB_WORKSPACE/topic-override-shas.json"

        CONFIG_IN="$config_in" CONFIG_OUT="$config_out" OVERRIDES_JSON="$GITHUB_WORKSPACE/topic-override-shas.json" DEP_TOPICS_JSON="$deps_file" PRIMARY_TOPIC="$topic_branch" python3 <<'PY'
        import os
        import sys
        import json

        config_in = os.environ["CONFIG_IN"]
        config_out = os.environ["CONFIG_OUT"]
        primary_topic = os.environ["PRIMARY_TOPIC"]
        with open(os.environ["OVERRIDES_JSON"], encoding="utf-8") as f:
            overrides = json.load(f)
        with open(os.environ["DEP_TOPICS_JSON"], encoding="utf-8") as f:
            dep_topics = json.load(f)

        with open(config_in, encoding="utf-8") as f:
            lines = f.readlines()

        out = []
        block = []
        matched = set()

        def flush_topic(topic_block):
            global matched
            if not topic_block:
                return
            topic_name = None
            for line in topic_block:
                stripped = line.strip()
                if stripped.startswith("name:") or stripped.startswith("branch:"):
                    value = stripped.split(":", 1)[1].strip().strip('"')
                    if value in overrides:
                        topic_name = value
                        break
            if topic_name:
                matched.add(topic_name)
                for line in topic_block:
                    stripped = line.strip()
                    if stripped.startswith("sha:"):
                        out.append(f"    sha: {overrides[topic_name]}\n")
                    elif stripped.startswith("tag:"):
                        out.append("    tag: null\n")
                    elif topic_name == primary_topic and stripped.startswith("depends_on:"):
                        raw_deps = stripped.split(":", 1)[1].strip()
                        existing_deps = []
                        if raw_deps.startswith("[") and raw_deps.endswith("]"):
                            existing_deps = [
                                dep.strip().strip('"').strip("'")
                                for dep in raw_deps[1:-1].split(",")
                                if dep.strip()
                            ]
                        combined_deps = sorted(set(existing_deps + dep_topics))
                        out.append(f"    depends_on: {json.dumps(combined_deps)}\n")
                    else:
                        out.append(line)
            else:
                out.extend(topic_block)

        in_topics = False
        for line in lines:
            if line.startswith("topics:"):
                in_topics = True
                out.append(line)
                continue
            if in_topics and line.startswith("  - name:"):
                flush_topic(block)
                block = [line]
                continue
            if in_topics and block:
                block.append(line)
            else:
                out.append(line)

        flush_topic(block)

        missing = sorted(set(overrides) - matched)
        if primary_topic in missing:
            print(f"ERROR: topic '{primary_topic}' was not found in {config_in}", file=sys.stderr)
            sys.exit(1)
        for topic in missing:
            out.extend([
                f"  - name: {topic}\n",
                "    repo: \"https://github.com/qualcomm-linux/kernel-topics.git\"\n",
                f"    branch: {topic}\n",
                f"    sha: {overrides[topic]}\n",
                "    tag: null\n",
                "    depends_on: []\n",
            ])

        with open(config_out, "w", encoding="utf-8") as f:
            f.writelines(out)
        PY

        echo "Using qcom-next.yaml with these topic overrides:"
        jq . "$GITHUB_WORKSPACE/topic-override-shas.json"

    - name: Run auto merge
      id: automerge
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        cd kernel
        ../automerge/ci-merge --yaml-config ../qcom-next-pr.yaml -t head -i qcom-next -c https://github.com/sgaud-quic/cache -n -p | tee $GITHUB_WORKSPACE/merge.log

    - name: Fetch PR
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        cd kernel
        git fetch https://github.com/qualcomm-linux/kernel-topics.git pull/${{inputs.pr_number}}/head:pr-${{inputs.pr_number}}
        git merge pr-${{inputs.pr_number}} --no-commit || echo "Merge already applied or fast-forwarded"
        if ! git diff --cached --quiet; then
          git commit -m "Merged PR ${{inputs.pr_number}}"
        else
          echo "Nothing to commit. PR may already be included in the topic branch tip."
        fi

    - name: Fetch PR
      if: steps.mode.outputs.mode == 'pr'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        git checkout ${{ inputs.base_branch }}
        git fetch https://github.com/${{ inputs.repo }}.git pull/${{inputs.pr_number}}/head:pr-${{inputs.pr_number}}
        git merge pr-${{ inputs.pr_number }} --no-commit || echo "Merge already applied or fast-forwarded"
        if ! git diff --cached --quiet; then
          git commit -m "Merged PR #${{ inputs.pr_number }}"
        else
          echo "Nothing to commit. PR may already be merged or fast-forwarded."
        fi

    - name: Set workspace path
      id: set-workspace
      shell: bash
      env:
        SYNC_MODE: ${{ steps.mode.outputs.mode }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        echo "workspace=${WORKSPACE}/kernel" >> "$GITHUB_OUTPUT"
