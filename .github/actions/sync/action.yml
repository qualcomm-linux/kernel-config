name: Sync workspace

inputs:
  base_branch:
    description: Branch or ref to check out
    required: true
    default: qcom-next-staging
  pr_number:
    description: PR number to merge. Leave empty or 0 to check out base_branch as-is.
    required: false
  GH_TOKEN:
    description: Access Token
    required: true
  repo:
    description: repo
    required: true

outputs:
  workspace_path:
    description: Sync workspace path
    value: ${{ steps.set-workspace.outputs.workspace }}

runs:
  using: "composite"
  steps:
    - name: Clean workspace
      shell: bash
      run: |
        echo "Cleaning up workspace..."
        rm -rf "${{ github.workspace }}/kernel" "${{ github.workspace }}/automerge"
        echo "Workspace cleaned successfully!"

    - name: Classify sync mode
      id: mode
      shell: bash
      env:
        IN_REPO: ${{ inputs.repo }}
        IN_PR: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail

        if [ "$IN_REPO" = "qualcomm-linux/kernel-topics" ]; then
          mode=topics
        elif [ -z "$IN_PR" ] || [ "$IN_PR" = "0" ]; then
          mode=ref
        else
          mode=pr
        fi

        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "Sync mode: $mode"

    - name: Checkout PR branch
      if: steps.mode.outputs.mode != 'topics'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.base_branch }}
        path: kernel
        token: ${{ inputs.GH_TOKEN }}

    - name: Configure git
      shell: bash
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

    - name: Sync with latest changes
      if: steps.mode.outputs.mode == 'pr'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -e
        echo "Syncing with latest changes..."
        git fetch origin ${{ inputs.base_branch }}
        git merge --no-ff origin/${{ inputs.base_branch }}

    - name: Record the checked out commit
      if: steps.mode.outputs.mode == 'ref'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        echo "Testing ${{ inputs.repo }} at ${{ inputs.base_branch }}"
        echo "commit: $(git rev-parse HEAD)"
        git --no-pager log -1 --format='%H %s'

    - name: Clone repositories
      if: steps.mode.outputs.mode == 'topics'
      shell: bash
      run: |
        git clone https://github.com/qualcomm-linux/kernel.git
        git clone --branch sha_config_yaml https://github.com/sgaud-quic/automerge.git

    - name: Scan PR Description
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        curl -L \
        -H "Authorization: Bearer ${{ inputs.GH_TOKEN }}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "https://api.github.com/repos/qualcomm-linux/kernel-topics/pulls/${{ inputs.pr_number }}" | \
        jq --raw-output .body > pr-desc
        cat pr-desc

    # A cross-topic dependency is only satisfied once it has travelled the whole
    # promotion path: merged into its own topic branch, tagged, and that tag
    # recorded in qcom-next.yaml. Until then this PR would be tested against a
    # tree that does not contain its prerequisite, so the run is stopped.
    #
    # "the topic has a tag" is not sufficient on its own: every topic in
    # qcom-next.yaml already carries a tag from an earlier promotion, so that
    # test would pass against a tag predating the dependency. The pin has to be
    # shown to actually contain the dependency's changes.
    #
    # Containment is decided by patch id, not by commit ancestry. Topic branches
    # here are rebased onto each new baseline, which orphans the dependency's
    # merge commit and re-applies its patches under fresh SHAs, so asking
    # whether the merge commit is an ancestor of the pin reports "diverged" for
    # a dependency that is plainly present. git cherry compares patch ids and
    # sees through the rebase. It is bounded by the dependency PR's own base
    # commit so only that PR's commits are considered, not everything that
    # happened to be on the branch when it was opened.
    #
    # A patch rewritten while resolving a rebase conflict gets a new patch id
    # and is reported as missing. That is the remaining false negative here.
    #
    # A dependency on another PR against the same topic branch is a stacked PR,
    # already present in the branch tip this run builds from, so it needs no
    # promotion. Cycles cannot deadlock: a dependency must be merged, and two
    # unmerged PRs depending on each other are both simply reported as unmerged.
    - name: Validate dependency promotions
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
        BASE_PR: ${{ inputs.pr_number }}
        PRIMARY_TOPIC: ${{ inputs.base_branch }}
      shell: bash
      run: |
        set -euo pipefail
        config_root="$(cd "${{ github.action_path }}/../../.." && pwd)"

        # The kernel clone made by "Clone repositories" above. Dependency refs
        # are fetched into it, which keeps this to incremental fetches rather
        # than a fresh clone of a kernel tree per dependency.
        CONFIG="$config_root/qcom-next.yaml" \
        KERNEL_DIR="$GITHUB_WORKSPACE/kernel" python3 <<'PY'
        import json
        import os
        import re
        import subprocess
        import sys
        import urllib.error
        import urllib.request

        REPO = "qualcomm-linux/kernel-topics"
        API = "https://api.github.com"

        # Accepted forms, deliberately tolerant: leading whitespace, any case,
        # and whitespace before the colon, with values separated by commas or
        # spaces and given as a bare number, a #-prefixed number, or a pull
        # request URL.
        #
        #   Depends-on: #2352
        #   Depends-on : 2352, #2353
        #   depends-on: https://github.com/<org>/<repo>/pull/2352
        #
        # The previous grep required an exact "^Depends-on:" and so ignored
        # "Depends-on : #2352". A trailer that is read by a human as a
        # dependency but not matched here silently disables the gate below,
        # which is the one failure mode this step must not have. Keep this in
        # step with the Depends-on parsing used by the qcom-next batch planner
        # where that exists, so both paths honour the same trailer.
        DEPENDS_ON_RE = re.compile(
            r"^[ \t]*depends-on[ \t]*:(.*)$", re.IGNORECASE | re.MULTILINE
        )
        PULL_URL_RE = re.compile(r"/pull/(\d+)")


        def parse_depends_on(body):
            """Return the dependency tokens named by Depends-on: lines.

            Tokens are returned as written, minus a leading '#', rather than
            being coerced to numbers: an entry that is not a PR number has to
            be reported as invalid instead of disappearing.
            """
            found = []
            for value in DEPENDS_ON_RE.findall(body or ""):
                for token in re.split(r"[,\s]+", value):
                    token = token.strip().strip(".,;:)(<>[]")
                    if not token:
                        continue
                    url = PULL_URL_RE.search(token)
                    entry = url.group(1) if url else token.lstrip("#")
                    if entry and entry not in found:
                        found.append(entry)
            return found

        token = os.environ.get("GH_TOKEN", "")
        base_pr = str(os.environ["BASE_PR"]).strip()
        primary = os.environ["PRIMARY_TOPIC"].strip()
        config = os.environ["CONFIG"]
        kernel_dir = os.environ["KERNEL_DIR"]
        DEFAULT_TOPICS_URL = f"https://github.com/{REPO}.git"


        def api(path):
            request = urllib.request.Request(f"{API}{path}")
            request.add_header("Accept", "application/vnd.github+json")
            request.add_header("X-GitHub-Api-Version", "2022-11-28")
            if token:
                request.add_header("Authorization", f"Bearer {token}")
            with urllib.request.urlopen(request, timeout=60) as response:
                return json.loads(response.read())


        def git(*args):
            return subprocess.run(
                ["git", "-C", kernel_dir, *args],
                capture_output=True,
                text=True,
            )


        def have_commit(sha):
            return git("cat-file", "-e", f"{sha}^{{commit}}").returncode == 0


        def missing_patches(slot, repo_url, topic, tag, pin_sha, dep, dep_base):
            """Return (missing_subjects, error).

            missing_subjects lists the dependency PR's commits whose patch is
            not present in the promoted pin. An empty list means the pin
            contains the dependency.
            """
            namespace = f"refs/dep/{slot}"
            refspecs = [
                f"+refs/pull/{dep}/head:{namespace}/head",
                f"+refs/tags/{tag}:{namespace}/tag",
            ]
            fetched = git("fetch", "--no-tags", "--quiet", repo_url, *refspecs)
            if fetched.returncode:
                # The tag may be missing while the branch still has the pin.
                fetched = git(
                    "fetch",
                    "--no-tags",
                    "--quiet",
                    repo_url,
                    f"+refs/pull/{dep}/head:{namespace}/head",
                    f"+refs/heads/{topic}:{namespace}/branch",
                )
                if fetched.returncode:
                    return None, (
                        f"could not fetch `{tag}` or `{topic}` and "
                        f"pull/{dep}/head from {repo_url} "
                        f"({fetched.stderr.strip().splitlines()[-1:] or ['unknown']})"
                    )

            if not have_commit(pin_sha):
                # Pin unreachable from the tag; the branch may still carry it.
                git(
                    "fetch",
                    "--no-tags",
                    "--quiet",
                    repo_url,
                    f"+refs/heads/{topic}:{namespace}/branch",
                )
            if not have_commit(pin_sha):
                return None, (
                    f"the pinned commit `{pin_sha[:12]}` for `{topic}` is not "
                    f"reachable from `{tag}` or `{topic}` in {repo_url}"
                )

            if not have_commit(dep_base):
                return None, (
                    f"the base commit of #{dep} (`{dep_base[:12]}`) was not "
                    "fetched, so its own commits cannot be isolated"
                )

            # Bounded by dep_base so only this PR's commits are considered.
            cherry = git("cherry", pin_sha, f"{namespace}/head", dep_base)
            if cherry.returncode:
                return None, (
                    "git cherry failed: "
                    f"{cherry.stderr.strip().splitlines()[-1:] or ['unknown']}"
                )

            missing = []
            for line in cherry.stdout.splitlines():
                parts = line.split()
                if len(parts) < 2 or parts[0] != "+":
                    continue
                subject = git(
                    "log", "-1", "--format=%s", parts[1]
                ).stdout.strip()
                missing.append(f"{parts[1][:12]} {subject}")
            return missing, None


        def pins(path):
            """Return {topic: {sha, tag, repo}} from qcom-next.yaml.

            Parsed line by line, like the generator below, so this action does
            not depend on PyYAML being present on the runner.
            """
            entries = {}
            block = []

            def flush():
                if not block:
                    return
                found = {}
                for line in block:
                    stripped = line.strip()
                    for field in ("name", "branch", "sha", "tag", "repo"):
                        if stripped.startswith(f"{field}:"):
                            found[field] = (
                                stripped.split(":", 1)[1].strip().strip('"')
                            )
                            break
                pin = {
                    "sha": found.get("sha", ""),
                    "tag": found.get("tag", ""),
                    "repo": found.get("repo", ""),
                }
                for key in ("name", "branch"):
                    if found.get(key):
                        entries[found[key]] = pin

            in_topics = False
            with open(path, encoding="utf-8") as handle:
                for line in handle:
                    if line.startswith("topics:"):
                        in_topics = True
                        continue
                    if not in_topics:
                        continue
                    if line.startswith("  - name:"):
                        flush()
                        block = [line]
                        continue
                    if block:
                        block.append(line)
            flush()
            return entries


        with open("pr-desc", encoding="utf-8") as handle:
            description = handle.read()

        deps = parse_depends_on(description)

        # Recorded for debugging; the parse above is the source of truth.
        with open("pr-deps", "w", encoding="utf-8") as handle:
            for dep in deps:
                handle.write(f"{dep}\n")

        print(f"declared dependencies: {', '.join(deps) if deps else '<none>'}")

        pin_for = pins(config)
        satisfied = []
        blocked = []

        for index, dep in enumerate(deps):
            if not dep.isdigit():
                blocked.append(
                    (
                        dep,
                        "not a PR number. Depends-on must name a kernel-topics "
                        "PR, because only a merged PR can be traced to a "
                        "promoted pin.",
                    )
                )
                continue

            if dep == base_pr:
                blocked.append((f"#{dep}", "a PR cannot depend on itself."))
                continue

            try:
                pull = api(f"/repos/{REPO}/pulls/{dep}")
            except (urllib.error.HTTPError, urllib.error.URLError, OSError) as error:
                blocked.append((f"#{dep}", f"could not be read ({error})."))
                continue

            if not pull.get("merged_at"):
                blocked.append(
                    (
                        f"#{dep}",
                        "is not merged into its topic branch yet. It must merge "
                        "first, then be tagged and promoted.",
                    )
                )
                continue

            topic = ((pull.get("base") or {}).get("ref") or "").strip()

            if topic == primary:
                satisfied.append(
                    (f"#{dep}", topic, "same topic branch, already in the tip")
                )
                continue

            entry = pin_for.get(topic)
            if entry is None:
                blocked.append(
                    (f"#{dep}", f"topic `{topic}` is not listed in qcom-next.yaml.")
                )
                continue

            tag = entry["tag"]
            if not tag or tag == "null":
                blocked.append(
                    (
                        f"#{dep}",
                        f"topic `{topic}` has no tag in qcom-next.yaml. It must "
                        "be tagged and promoted before this PR can be tested.",
                    )
                )
                continue

            dep_base = ((pull.get("base") or {}).get("sha") or "").strip()
            if not dep_base:
                blocked.append(
                    (f"#{dep}", "has no base commit recorded on the GitHub API.")
                )
                continue

            missing, error = missing_patches(
                slot=index,
                repo_url=entry["repo"] or DEFAULT_TOPICS_URL,
                topic=topic,
                tag=tag,
                pin_sha=entry["sha"],
                dep=dep,
                dep_base=dep_base,
            )
            if error is not None:
                blocked.append((f"#{dep}", error))
                continue

            if missing:
                detail = "; ".join(f"`{item}`" for item in missing[:3])
                if len(missing) > 3:
                    detail += f" and {len(missing) - 3} more"
                blocked.append(
                    (
                        f"#{dep}",
                        f"is merged but the promoted pin for `{topic}` (`{tag}`) "
                        f"does not contain {len(missing)} of its commit(s): "
                        f"{detail}. A newer tag has to be promoted first.",
                    )
                )
                continue

            satisfied.append((f"#{dep}", topic, tag))

        for ref, topic, detail in satisfied:
            print(f"dependency {ref}: satisfied by {topic} ({detail})")

        dep_topics = sorted(
            {topic for _ref, topic, _detail in satisfied if topic != primary}
        )
        with open("dep-topics", "w", encoding="utf-8") as handle:
            for topic in dep_topics:
                handle.write(f"{topic}\n")

        if not blocked:
            if dep_topics:
                print("dependency topics taken from qcom-next.yaml: " + ", ".join(dep_topics))
            sys.exit(0)

        for ref, reason in blocked:
            print(f"dependency {ref}: BLOCKED: {reason}")

        body = "\n".join(
            [
                "<!-- qcom-next-dep-gate -->",
                "### CI not run: a dependency is not promoted yet",
                "",
                "This PR declares `Depends-on:` prerequisites that have not"
                " completed the promotion path, so it was not built. Testing it"
                " now would use a tree without its prerequisites.",
                "",
                "| Dependency | Reason |",
                "| --- | --- |",
            ]
            + [f"| {ref} | {reason} |" for ref, reason in blocked]
            + [
                "",
                "Required order for each dependency:",
                "",
                "1. The dependency PR merges into its own topic branch.",
                "2. That topic branch is tagged.",
                "3. The tag is promoted into `qcom-next.yaml`.",
                "",
                "Once that is done, a maintainer needs to re-run this workflow.",
            ]
        )

        payload = json.dumps({"body": body}).encode("utf-8")
        request = urllib.request.Request(
            f"{API}/repos/{REPO}/issues/{base_pr}/comments", data=payload
        )
        request.add_header("Accept", "application/vnd.github+json")
        request.add_header("X-GitHub-Api-Version", "2022-11-28")
        request.add_header("Content-Type", "application/json")
        if token:
            request.add_header("Authorization", f"Bearer {token}")
        try:
            with urllib.request.urlopen(request, timeout=60) as response:
                response.read()
        except (urllib.error.HTTPError, urllib.error.URLError, OSError) as error:
            print(f"warning: could not comment on #{base_pr}: {error}")

        print(
            "::error title=qcom-next dependency::"
            f"{len(blocked)} dependency/dependencies are not promoted yet; "
            "see the PR comment for the required order"
        )
        sys.exit(1)
        PY

    - name: Create qcom-next YAML for topic PR
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        set -euo pipefail
        topic_branch="${{ inputs.base_branch }}"
        config_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        config_in="$config_root/qcom-next.yaml"
        config_out="$GITHUB_WORKSPACE/qcom-next-pr.yaml"

        # Only this PR's own topic is overridden to its branch tip; the PR head
        # is merged on top afterwards. Dependency topics are deliberately left
        # at whatever qcom-next.yaml pins, because the gate above has already
        # proved that pin contains them. Overriding them to a live branch tip
        # would test unpromoted work and make the run unreproducible.
        topics_file="$GITHUB_WORKSPACE/topic-overrides.txt"
        printf '%s\n' "$topic_branch" > "$topics_file"
        sort -u "$topics_file" -o "$topics_file"

        deps_file="$GITHUB_WORKSPACE/topic-dependencies.json"
        if [ -s dep-topics ]; then
          sort -u dep-topics | jq -R . | jq -s . > "$deps_file"
        else
          jq -n '[]' > "$deps_file"
        fi

        : > "$GITHUB_WORKSPACE/topic-override-shas.jsonl"
        while IFS= read -r override_branch; do
          [ -z "$override_branch" ] && continue
          override_sha="$(git ls-remote https://github.com/qualcomm-linux/kernel-topics.git "refs/heads/${override_branch}" | awk '{print $1}')"
          if [ -z "$override_sha" ]; then
            echo "ERROR: topic branch '${override_branch}' was not found in qualcomm-linux/kernel-topics" >&2
            exit 1
          fi
          jq -n --arg branch "$override_branch" --arg sha "$override_sha" '{($branch): $sha}' >> "$GITHUB_WORKSPACE/topic-override-shas.jsonl"
        done < "$topics_file"
        jq -s 'add' "$GITHUB_WORKSPACE/topic-override-shas.jsonl" > "$GITHUB_WORKSPACE/topic-override-shas.json"

        CONFIG_IN="$config_in" CONFIG_OUT="$config_out" OVERRIDES_JSON="$GITHUB_WORKSPACE/topic-override-shas.json" DEP_TOPICS_JSON="$deps_file" PRIMARY_TOPIC="$topic_branch" python3 <<'PY'
        import os
        import sys
        import json

        config_in = os.environ["CONFIG_IN"]
        config_out = os.environ["CONFIG_OUT"]
        primary_topic = os.environ["PRIMARY_TOPIC"]
        with open(os.environ["OVERRIDES_JSON"], encoding="utf-8") as f:
            overrides = json.load(f)
        with open(os.environ["DEP_TOPICS_JSON"], encoding="utf-8") as f:
            dep_topics = json.load(f)

        with open(config_in, encoding="utf-8") as f:
            lines = f.readlines()

        out = []
        block = []
        matched = set()

        def flush_topic(topic_block):
            global matched
            if not topic_block:
                return
            topic_name = None
            for line in topic_block:
                stripped = line.strip()
                if stripped.startswith("name:") or stripped.startswith("branch:"):
                    value = stripped.split(":", 1)[1].strip().strip('"')
                    if value in overrides:
                        topic_name = value
                        break
            if topic_name:
                matched.add(topic_name)
                for line in topic_block:
                    stripped = line.strip()
                    if stripped.startswith("sha:"):
                        out.append(f"    sha: {overrides[topic_name]}\n")
                    elif stripped.startswith("tag:"):
                        out.append("    tag: null\n")
                    elif topic_name == primary_topic and stripped.startswith("depends_on:"):
                        raw_deps = stripped.split(":", 1)[1].strip()
                        existing_deps = []
                        if raw_deps.startswith("[") and raw_deps.endswith("]"):
                            existing_deps = [
                                dep.strip().strip('"').strip("'")
                                for dep in raw_deps[1:-1].split(",")
                                if dep.strip()
                            ]
                        combined_deps = sorted(set(existing_deps + dep_topics))
                        out.append(f"    depends_on: {json.dumps(combined_deps)}\n")
                    else:
                        out.append(line)
            else:
                out.extend(topic_block)

        in_topics = False
        for line in lines:
            if line.startswith("topics:"):
                in_topics = True
                out.append(line)
                continue
            if in_topics and line.startswith("  - name:"):
                flush_topic(block)
                block = [line]
                continue
            if in_topics and block:
                block.append(line)
            else:
                out.append(line)

        flush_topic(block)

        missing = sorted(set(overrides) - matched)
        if primary_topic in missing:
            print(f"ERROR: topic '{primary_topic}' was not found in {config_in}", file=sys.stderr)
            sys.exit(1)
        for topic in missing:
            out.extend([
                f"  - name: {topic}\n",
                "    repo: \"https://github.com/qualcomm-linux/kernel-topics.git\"\n",
                f"    branch: {topic}\n",
                f"    sha: {overrides[topic]}\n",
                "    tag: null\n",
                "    depends_on: []\n",
            ])

        with open(config_out, "w", encoding="utf-8") as f:
            f.writelines(out)
        PY

        echo "Using qcom-next.yaml with these topic overrides:"
        jq . "$GITHUB_WORKSPACE/topic-override-shas.json"

    - name: Run auto merge
      id: automerge
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        cd kernel
        # Neither --interactive nor --pass. -n is --interactive despite the
        # spelling, and it sends a conflict to git mergetool, which cannot work
        # without a tty, so the rerere cache passed with -c never got a chance
        # to resolve anything. It also made --pass dead, since automerge only
        # reads that flag on the non-interactive path. Without both, a conflict
        # is first resolved from the cache and only aborts the run if it cannot
        # be, naming the topic that failed.
        ../automerge/ci-merge --yaml-config ../qcom-next-pr.yaml -t head -i qcom-next -c https://github.com/sgaud-quic/cache | tee $GITHUB_WORKSPACE/merge.log

    - name: Fetch PR
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        cd kernel
        git fetch https://github.com/qualcomm-linux/kernel-topics.git pull/${{inputs.pr_number}}/head:pr-${{inputs.pr_number}}
        git merge pr-${{inputs.pr_number}} --no-commit || echo "Merge already applied or fast-forwarded"
        if ! git diff --cached --quiet; then
          git commit -m "Merged PR ${{inputs.pr_number}}"
        else
          echo "Nothing to commit. PR may already be included in the topic branch tip."
        fi

    - name: Fetch PR
      if: steps.mode.outputs.mode == 'pr'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        git checkout ${{ inputs.base_branch }}
        git fetch https://github.com/${{ inputs.repo }}.git pull/${{inputs.pr_number}}/head:pr-${{inputs.pr_number}}
        git merge pr-${{ inputs.pr_number }} --no-commit || echo "Merge already applied or fast-forwarded"
        if ! git diff --cached --quiet; then
          git commit -m "Merged PR #${{ inputs.pr_number }}"
        else
          echo "Nothing to commit. PR may already be merged or fast-forwarded."
        fi

    - name: Set workspace path
      id: set-workspace
      shell: bash
      env:
        SYNC_MODE: ${{ steps.mode.outputs.mode }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        echo "workspace=${WORKSPACE}/kernel" >> "$GITHUB_OUTPUT"
