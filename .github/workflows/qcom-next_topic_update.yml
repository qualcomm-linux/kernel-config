---
# Reusable qcom-next topic update pipeline.
#
# Wrappers call this for automatic PR validation and manual multi-PR runs.
name: _qcom-next_topic_update

on:
  workflow_call:
    inputs:
      pr_number:
        description: kernel-config PR number containing qcom-next.yaml changes
        type: string
        required: false
        default: ""
      pr_numbers:
        description: JSON array of kernel-config PR numbers to merge and validate in one batch
        type: string
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # qcom-next candidate generation updates shared refs/cache state, so serialize
  # all automatic and manual invocations instead of canceling in-flight runs.
  group: qcom-next-topic-update
  cancel-in-progress: false

env:
  # Candidates live in the staging kernel repo for validation before publish.
  KERNEL_REPO: qualcomm-linux-stg/kernel
  TOPICS_REPO: qualcomm-linux/kernel-topics
  AUTOMERGE_REPO: sgaud-quic/automerge
  S3_BUCKET: qli-prd-kernel-gh-artifacts

jobs:
  candidate:
    name: Build and push the candidate
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [self-hosted, kernel-prd-u2404-x64-large-od-ephem]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      sha: ${{ steps.push.outputs.sha }}
      prs_json: ${{ steps.merge_prs.outputs.prs_json }}
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4
        with:
          path: kernel-config
          fetch-depth: 0

      - name: Merge kernel-config PRs
        id: merge_prs
        env:
          PR: ${{ inputs.pr_number }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
        run: |
          set -euo pipefail
          cd kernel-config
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          base_sha="$(git rev-parse HEAD)"

          if [ -n "$PR" ]; then
            prs=("$PR")
          else
            mapfile -t prs < <(jq -r '.[]' <<< "$PR_NUMBERS")
          fi

          for pr in "${prs[@]}"; do
            echo "Merging kernel-config PR #$pr"
            git fetch origin "pull/${pr}/head:pr-${pr}"
            head_sha="$(git rev-parse "pr-${pr}")"
            git merge --no-ff --no-edit "pr-${pr}"
            merge_sha="$(git rev-parse HEAD)"
            jq -n \
              --arg number "$pr" \
              --arg head_sha "$head_sha" \
              --arg merge_sha "$merge_sha" \
              '{number: ($number | tonumber), head_sha: $head_sha, merge_sha: $merge_sha}' >> ../prs.jsonl
          done

          merged_sha="$(git rev-parse HEAD)"
          prs_json="$(jq -s -c . ../prs.jsonl)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
          echo "prs_json=$prs_json" >> "$GITHUB_OUTPUT"

      - name: Checkout automerge
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOMERGE_REPO }}
          path: automerge
          ref: sha_config_yaml
          token: ${{ secrets.SPAT || github.token }}

      - name: Checkout kernel-topics
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOPICS_REPO }}
          path: kernel-topics
          # Full history and tags: a pinned sha is often behind the branch tip,
          # and after a rebase it is only reachable through its tag.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SPAT || github.token }}

      - name: Run Automerge
        run:  |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/kernel-topics
          test -f $GITHUB_WORKSPACE/kernel-config/qcom-next.conf
          echo $GITHUB_WORKSPACE/kernel-config/qcom-next.yaml
          $GITHUB_WORKSPACE/automerge/ci-merge --yaml-config $GITHUB_WORKSPACE/kernel-config/qcom-next.yaml -t head -i qcom-next -c https://github.com/sgaud-quic/cache -n -p | tee $GITHUB_WORKSPACE/merge.log

      - name: Parse and Add logs
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/kernel-topics
          mkdir qcom-next
          $GITHUB_WORKSPACE/automerge/log-parser.sh $GITHUB_WORKSPACE/merge.log
          cp topic_SHA1 qcom-next
          cp ../merge.log qcom-next/
          sed -i 's/\r$//' qcom-next/merge.log
          sed -i -E 's#https://x-access-token:[^/@[:space:]]+@github\.com/#https://x-access-token:***@github.com/#g' qcom-next/merge.log
          sed -i -E 's#https://[^/@[:space:]]+@github\.com/#https://***@github.com/#g' qcom-next/merge.log
          git config user.email "sgaud@qti.qualcomm.com"
          git config user.name  "Salendarsingh Gaud"
          git add qcom-next/merge.log qcom-next/topic_SHA1
          git commit -m "Add qcom-next log files for $(date '+%Y%m%d')" -m "Adding merge log file and topic_SHA1 file" -s

      - name: Push the candidate
        id: push
        env:
          GH_PUSH_TOKEN: ${{ secrets.SPAT }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PUSH_TOKEN:-}" ]; then
            echo "::error title=qcom-next::SPAT is needed to push the candidate to ${KERNEL_REPO}"
            exit 1
          fi

          if [ -n "$PR" ]; then
            ref="qcom-next-candidate-${PR}"
          else
            ref="qcom-next-candidate-batch-${{ github.run_id }}"
          fi

          cd kernel-topics
          sha="$(git rev-parse refs/heads/qcom-next)"
          git remote remove candidate 2>/dev/null || true
          git remote add candidate \
              "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${KERNEL_REPO}.git"
          git push --force candidate "refs/heads/qcom-next:refs/heads/${ref}"
          git remote remove candidate

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pushed ${KERNEL_REPO} ${ref} @ ${sha:0:12}"

      - name: Store candidate metadata
        id: metadata
        env:
          PRS_JSON: ${{ steps.merge_prs.outputs.prs_json }}
          KERNEL_CONFIG_BASE_SHA: ${{ steps.merge_prs.outputs.base_sha }}
          KERNEL_CONFIG_MERGED_SHA: ${{ steps.merge_prs.outputs.merged_sha }}
          CANDIDATE_REF: ${{ steps.push.outputs.ref }}
          CANDIDATE_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          metadata_path="${{ runner.temp }}/qcom-next-metadata.json"
          s3_key="qcom-next/ci/${{ github.run_id }}/metadata.json"

          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg kernel_config_base_sha "$KERNEL_CONFIG_BASE_SHA" \
            --arg kernel_config_merged_sha "$KERNEL_CONFIG_MERGED_SHA" \
            --arg candidate_repo "$KERNEL_REPO" \
            --arg candidate_ref "$CANDIDATE_REF" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg s3_bucket "$S3_BUCKET" \
            --arg s3_key "$s3_key" \
            --argjson prs "$PRS_JSON" \
            '{schema_version: 1, run_id: $run_id, run_attempt: $run_attempt, kernel_config_base_sha: $kernel_config_base_sha, kernel_config_merged_sha: $kernel_config_merged_sha, prs: $prs, candidate: {repo: $candidate_repo, ref: $candidate_ref, sha: $candidate_sha}, metadata: {s3_bucket: $s3_bucket, s3_key: $s3_key}}' \
            > "$metadata_path"

          aws s3 cp "$metadata_path" "s3://${S3_BUCKET}/${s3_key}"
          echo "s3_key=$s3_key" >> "$GITHUB_OUTPUT"

      - name: Comment CI metadata run id on PRs
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PRS_JSON: ${{ steps.merge_prs.outputs.prs_json }}
          CANDIDATE_REF: ${{ steps.push.outputs.ref }}
          CANDIDATE_SHA: ${{ steps.push.outputs.sha }}
          S3_KEY: ${{ steps.metadata.outputs.s3_key }}
        with:
          github-token: ${{ secrets.PAT || secrets.SPAT || github.token }}
          script: |
            const prs = JSON.parse(process.env.PRS_JSON);
            const body = [
              '<!-- qcom-next-ci-metadata -->',
              'qcom-next CI metadata is ready.',
              '',
              `Run ID: ${context.runId}`,
              `Candidate: ${process.env.CANDIDATE_REF} @ ${process.env.CANDIDATE_SHA}`,
              `S3 key: ${process.env.S3_KEY}`,
              '',
              'qcom-next is published automatically if all CI tests pass. Use this Run ID with the qcom-next publish workflow for a manual republish if needed.'
            ].join('\n');

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f kernel-topics/qcom-next/topic_SHA1 ]; then
            echo "### qcom-next candidate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated branch: ${{ steps.push.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated SHA: ${{ steps.push.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Metadata S3 key: ${{ steps.metadata.outputs.s3_key }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The tree was not built; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-candidate
          path: |
            merge.log
            kernel-config/qcom-next-known-failures.yaml
            kernel-topics/qcom-next/merge.log
            kernel-topics/qcom-next/topic_SHA1
          if-no-files-found: warn
          retention-days: 14

  premerge:
    name: pre_merge
    needs: candidate
    uses: ./.github/workflows/pre_merge.yml
    secrets: inherit
    with:
      repo: qualcomm-linux-stg/kernel
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}
      pr: "0"

  yocto:
    name: pre_merge_yocto
    needs: candidate
    uses: ./.github/workflows/pre-merge-yocto.yml
    secrets: inherit
    with:
      repo: qualcomm-linux-stg/kernel
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}

  test-results:
    name: Evaluate qcom-next test results
    if: always()
    needs: [candidate, premerge, yocto]
    runs-on: ubuntu-latest
    steps:
      - name: Download LAVA result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Tests-*
          path: lava-results
          merge-multiple: true

      - name: Download qcom-next candidate metadata
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qcom-next-candidate
          path: qcom-next-candidate

      - name: Generate test result summary
        id: result_summary
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(lava-results/*.json)
          failed=0
          has_failures=0
          summary_file="${RUNNER_TEMP}/qcom-next-failure-summary.md"
          known_failures_file="${RUNNER_TEMP}/qcom-next-known-failures.json"
          known_failure_details_file="${RUNNER_TEMP}/qcom-next-known-failure-details.md"
          unexpected_details_file="${RUNNER_TEMP}/qcom-next-unexpected-failure-details.md"
          : > "$known_failure_details_file"
          : > "$unexpected_details_file"

          append_known_failure() {
            printf -- '- %s\n' "$1" >> "$known_failure_details_file"
            has_failures=1
          }

          append_unexpected_failure() {
            printf -- '- %s\n' "$1" >> "$unexpected_details_file"
            has_failures=1
            failed=1
          }

          config_file="qcom-next-candidate/kernel-config/qcom-next-known-failures.yaml"
          if [ -f "$config_file" ]; then
            if ! ruby -ryaml -rjson -e '
              config = YAML.load_file(ARGV[0]) || {}
              failures = if config.is_a?(Array)
                config
              else
                config["failures"] || config["known_failures"] || config["test_failures"] || []
              end
              normalized = failures.map do |entry|
                if entry.is_a?(Hash)
                  target = entry["target"] || entry[:target] || "*"
                  name = entry["name"] || entry[:name] || entry["test"] || entry[:test]
                  result = entry["result"] || entry[:result] || "*"
                else
                  value = entry.to_s
                  parts = value.split("::", 2)
                  target = parts.length == 2 ? parts[0] : "*"
                  name = parts.length == 2 ? parts[1] : value
                  result = "*"
                end
                {"target" => target.to_s, "name" => name.to_s, "result" => result.to_s}
              end.reject { |failure| failure["name"].empty? }
              puts JSON.generate(normalized)
            ' "$config_file" > "$known_failures_file"
            then
              echo "[]" > "$known_failures_file"
              append_unexpected_failure "Unable to parse \`qcom-next-known-failures.yaml\`; known failure list is unavailable."
            fi
          else
            echo "[]" > "$known_failures_file"
            append_unexpected_failure "Unable to load \`qcom-next-known-failures.yaml\`; known failure list is unavailable."
          fi

          known_failure_count="$(jq 'length' "$known_failures_file")"

          {
            echo "### qcom-next test result"
            echo ""
            echo "| Gate | Workflow result |"
            echo "| --- | --- |"
            echo "| candidate | ${{ needs.candidate.result }} |"
            echo "| pre_merge | ${{ needs.premerge.result }} |"
            echo "| pre_merge_yocto | ${{ needs.yocto.result }} |"
            echo ""
            echo "Known failures configured: ${known_failure_count}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "<!-- qcom-next-test-results -->"
            echo "### qcom-next test results"
            echo ""
            echo "Workflow run: [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ""
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| candidate | ${{ needs.candidate.result }} |"
            echo "| pre_merge | ${{ needs.premerge.result }} |"
            echo "| pre_merge_yocto | ${{ needs.yocto.result }} |"
            echo ""
            echo "Known failures configured: ${known_failure_count}"
            echo ""
          } > "$summary_file"

          if [ "${{ needs.candidate.result }}" != "success" ]; then
            append_unexpected_failure "\`candidate\` workflow completed with \`${{ needs.candidate.result }}\`."
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No LAVA result JSON artifacts were found." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=qcom-next::No LAVA result JSON artifacts were found"
            append_unexpected_failure "No LAVA result JSON artifacts were found."
          else
            {
              echo "| Target | Pass | Non-pass | Total |"
              echo "| --- | :---: | :---: | :---: |"
            } >> "$GITHUB_STEP_SUMMARY"

            {
              echo "| Target | Pass | Non-pass | Total |"
              echo "| --- | :---: | :---: | :---: |"
            } >> "$summary_file"

            for file in "${files[@]}"; do
              target="$(basename "$file" .json)"
              target="${target#Tests-}"
              total="$(jq 'length' "$file")"
              pass="$(jq '[.[] | select(.result == "pass")] | length' "$file")"
              non_pass="$(jq '[.[] | select(.result != "pass")] | length' "$file")"

              printf '| %s | %s | %s | %s |\n' "$target" "$pass" "$non_pass" "$total" >> "$GITHUB_STEP_SUMMARY"
              printf '| %s | %s | %s | %s |\n' "$target" "$pass" "$non_pass" "$total" >> "$summary_file"

              if [ "$total" -eq 0 ]; then
                append_unexpected_failure "\`${target}\` result artifact is empty."
              fi

              if [ "$non_pass" -ne 0 ]; then
                while IFS=$'\t' read -r test_name result; do
                  [ -n "$test_name" ] || continue
                  if jq -e \
                    --arg target "$target" \
                    --arg name "$test_name" \
                    --arg result "$result" \
                    'any(.[]; (.target == "*" or .target == $target) and .name == $name and (.result == "*" or .result == $result))' \
                    "$known_failures_file" >/dev/null; then
                    append_known_failure "\`${target}\`: \`${test_name}\` => \`${result}\`."
                    printf '::notice title=qcom-next::known failure: %s: %s => %s\n' "$target" "$test_name" "$result"
                  else
                    append_unexpected_failure "\`${target}\`: \`${test_name}\` => \`${result}\`."
                    printf '::error title=qcom-next::unexpected failure: %s: %s => %s\n' "$target" "$test_name" "$result"
                  fi
                done < <(jq -r '.[] | select(.result != "pass") | [.name, .result] | @tsv' "$file")
              fi
            done
          fi

          if [ -s "$known_failure_details_file" ] || [ -s "$unexpected_details_file" ]; then
            {
              echo ""
              echo "<details>"
              echo "<summary>Failure summary</summary>"
              echo ""
            } >> "$summary_file"

            if [ -s "$known_failure_details_file" ]; then
              {
                echo "#### Known failures"
                cat "$known_failure_details_file"
                echo ""
              } >> "$summary_file"
            fi

            if [ -s "$unexpected_details_file" ]; then
              {
                echo "#### Unexpected failures"
                cat "$unexpected_details_file"
                echo ""
              } >> "$summary_file"
            fi

            echo "</details>" >> "$summary_file"
          fi

          if [ "$failed" -ne 0 ]; then
            {
              echo ""
              echo "Result: blocked because unexpected failures were found."
            } >> "$summary_file"
            echo "qcom-next result: failed"
          elif [ "$has_failures" -ne 0 ]; then
            {
              echo ""
              echo "Result: continuing because all observed test failures are listed in qcom-next-known-failures.yaml."
            } >> "$summary_file"
            echo "qcom-next result: passed with known failures"
          else
            echo "qcom-next result: passed"
          fi

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "has_failures=$has_failures" >> "$GITHUB_OUTPUT"

      - name: Post test result summary on PRs
        if: steps.result_summary.outputs.has_failures == '1'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PRS_JSON: ${{ needs.candidate.outputs.prs_json }}
          SUMMARY_FILE: ${{ runner.temp }}/qcom-next-failure-summary.md
        with:
          github-token: ${{ secrets.PAT || secrets.SPAT || github.token }}
          script: |
            const fs = require('fs');

            const prsRaw = process.env.PRS_JSON || '';
            if (!prsRaw) {
              core.warning('No kernel-config PR list was available; skipping PR failure summary comment.');
              return;
            }

            const prs = JSON.parse(prsRaw);
            const body = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8');

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Fail qcom-next test results
        if: steps.result_summary.outputs.failed == '1'
        run: exit 1

  publish:
    name: Publish qcom-next
    needs: test-results
    uses: ./.github/workflows/qcom-next_publish.yml
    secrets: inherit
    with:
      run_id: ${{ github.run_id }}
