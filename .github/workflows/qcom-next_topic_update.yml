---
# Reusable qcom-next topic update pipeline.
#
# Wrappers call this for automatic PR validation and manual multi-PR runs.
name: _qcom-next_topic_update

on:
  workflow_call:
    inputs:
      pr_number:
        description: kernel-config PR number containing qcom-next.yaml changes
        type: string
        required: false
        default: ""
      pr_numbers:
        description: JSON array of kernel-config PR numbers to merge and validate in one batch
        type: string
        required: false
        default: ""
      max_quarantine_attempts:
        description: >
          How many times to rebuild the candidate after dropping a PR whose
          topic branch failed to merge. automerge stops at the first conflicting
          topic, so a batch with N conflicting PRs needs N+1 attempts. The
          default covers a full batch of the largest zone.
        type: string
        required: false
        default: "5"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # qcom-next candidate generation updates shared refs/cache state, so serialize
  # all automatic and manual invocations instead of canceling in-flight runs.
  group: qcom-next-topic-update
  cancel-in-progress: false

env:
  # Candidates live in the staging kernel repo for validation before publish.
  KERNEL_REPO: qualcomm-linux/kernel
  TOPICS_REPO: qualcomm-linux/kernel-topics
  AUTOMERGE_REPO: sgaud-quic/automerge
  S3_BUCKET: qli-prd-kernel-gh-artifacts
  # Browsable mirror of the artifact bucket.
  ARTIFACT_BASE_URL: https://qli-prod-artifacts.qualcomm.com

jobs:
  candidate:
    name: Build and push the candidate
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [self-hosted, kernel-prd-u2404-x64-large-od-ephem]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      sha: ${{ steps.push.outputs.sha }}
      prs_json: ${{ steps.build.outputs.prs_json }}
      dropped_json: ${{ steps.build.outputs.dropped_json }}
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4
        with:
          path: kernel-config
          fetch-depth: 0

      - name: Checkout automerge
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOMERGE_REPO }}
          path: automerge
          ref: sha_config_yaml
          token: ${{ secrets.SPAT || github.token }}

      - name: Checkout kernel-topics
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOPICS_REPO }}
          path: kernel-topics
          # Full history and tags: a pinned sha is often behind the branch tip,
          # and after a rebase it is only reachable through its tag.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SPAT || github.token }}

      # Merge the kernel-config PRs, run automerge, and if a topic branch
      # conflicts, drop the PR that promoted it and rebuild with the rest.
      #
      # automerge is invoked with -p, so a conflicting topic is aborted and
      # skipped rather than failing the run. Left alone that would publish a
      # tree missing a topic that qcom-next.yaml still claims, so each
      # conflicting topic is blamed on its PR and the candidate is rebuilt.
      - name: Build candidate, quarantining conflicting PRs
        id: build
        env:
          PR: ${{ inputs.pr_number }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          MAX_ATTEMPTS: ${{ inputs.max_quarantine_attempts }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/kernel-config/.github/scripts/qcom_next_topics.py"
          workspace="$GITHUB_WORKSPACE"

          cd "$workspace/kernel-config"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          base_sha="$(git rev-parse HEAD)"

          if [ -n "$PR" ]; then
            active=("$PR")
          else
            mapfile -t active < <(jq -r '.[]' <<< "$PR_NUMBERS")
          fi
          echo "batch: ${active[*]}"

          # Fetch every PR head once up front.
          for pr in "${active[@]}"; do
            git fetch --quiet origin "pull/${pr}/head:pr-${pr}"
          done

          : > "$workspace/dropped.jsonl"
          attempt=1
          limit="${MAX_ATTEMPTS:-5}"

          # Publish the dropped list on every exit path, so a PR that conflicted
          # is labelled and told why even when the run as a whole fails.
          emit_dropped() {
            jq -s -c . "$workspace/dropped.jsonl" > "$workspace/dropped.json"
            {
              echo "prs_json=${1}"
              echo "dropped_json=$(cat "$workspace/dropped.json")"
            } >> "$GITHUB_OUTPUT"
          }

          while :; do
            echo "::group::candidate attempt ${attempt}"

            # ---- rebuild kernel-config from base with the surviving PRs ----
            cd "$workspace/kernel-config"
            git checkout --quiet --detach "$base_sha"
            : > "$workspace/prs.jsonl"
            cp qcom-next.yaml "$workspace/before.yaml"

            for pr in "${active[@]}"; do
              echo "merging kernel-config PR #${pr}"
              head_sha="$(git rev-parse "pr-${pr}")"
              git merge --no-ff --no-edit "pr-${pr}"
              merge_sha="$(git rev-parse HEAD)"
              cp qcom-next.yaml "$workspace/after.yaml"
              topics="$(python3 "$helper" diff \
                "$workspace/before.yaml" "$workspace/after.yaml" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
              jq -n \
                --arg number "$pr" \
                --arg head_sha "$head_sha" \
                --arg merge_sha "$merge_sha" \
                --argjson topics "$topics" \
                '{number: ($number | tonumber), head_sha: $head_sha, merge_sha: $merge_sha, topics: $topics}' \
                >> "$workspace/prs.jsonl"
              echo "  topics: $(jq -r 'join(", ")' <<< "$topics")"
              mv "$workspace/after.yaml" "$workspace/before.yaml"
            done

            merged_sha="$(git rev-parse HEAD)"
            jq -s -c . "$workspace/prs.jsonl" > "$workspace/prs.json"

            # ---- automerge the topic branches ------------------------------
            #
            # Deliberately without --pass and without --interactive:
            #   no --interactive : a conflict first gets a chance to be
            #                      resolved from the rerere cache. Only if that
            #                      fails is the merge aborted.
            #   no --pass        : an unresolved conflict aborts the merge and
            #                      exits non-zero instead of skipping the topic,
            #                      so a topic can never be silently missing from
            #                      the candidate.
            # It therefore stops at the first conflicting topic, which is why
            # the quarantine loop may need one attempt per conflicting PR.
            cd "$workspace/kernel-topics"
            git config user.email "sgaud@qti.qualcomm.com"
            git config user.name  "Salendarsingh Gaud"
            test -f "$workspace/kernel-config/qcom-next.conf"
            rm -f topic_SHA1 topic_conflict
            set +e
            "$workspace/automerge/ci-merge" \
              --yaml-config "$workspace/kernel-config/qcom-next.yaml" \
              -t head -i qcom-next \
              -c https://github.com/qualcomm-linux/kernel-rrcache \
              | tee "$workspace/merge.log"
            merge_rc="${PIPESTATUS[0]}"
            set -e
            echo "ci-merge exit=${merge_rc}"

            # Always parse, so topic_SHA1 reflects whatever did merge.
            "$workspace/automerge/log-parser.sh" "$workspace/merge.log" || true

            # ---- blame any conflicting topic on its PR ---------------------
            blame="$(python3 "$helper" blame \
              --prs "$workspace/prs.json" \
              --conflicts topic_conflict \
              --merge-log "$workspace/merge.log")"
            echo "$blame"
            echo "::endgroup::"

            conflicts="$(jq -r '.conflicts | length' <<< "$blame")"

            if [ "$merge_rc" -eq 0 ] && [ "$conflicts" -eq 0 ]; then
              echo "no topic conflicts"
              break
            fi

            # Non-zero exit with nothing to blame is not a topic conflict:
            # a bad tag, an unreachable sha, a fetch failure. Retrying would
            # not help and dropping a PR would hide it.
            if [ "$conflicts" -eq 0 ]; then
              echo "::error title=qcom-next::automerge failed (exit ${merge_rc}) without reporting a conflicting topic. See merge.log; this is not something dropping a PR can fix."
              emit_dropped "[]"
              exit 1
            fi

            # Record whatever was blamed this round up front, so the PRs are
            # still reported even if the run fails for another reason below.
            jq -c '.blamed[]' <<< "$blame" >> "$workspace/dropped.jsonl"

            unattributed="$(jq -r '.unattributed | join(", ")' <<< "$blame")"
            if [ -n "$unattributed" ]; then
              echo "::error title=qcom-next::topic(s) conflicted but no PR in this batch promoted them: ${unattributed}. The candidate would be missing them, so the run is failed instead."
              emit_dropped "[]"
              exit 1
            fi

            mapfile -t blamed < <(jq -r '.blamed[].number' <<< "$blame")
            echo "::warning title=qcom-next::dropping conflicting PR(s) from the batch: ${blamed[*]}"

            remaining=()
            for pr in "${active[@]}"; do
              keep=1
              for bad in "${blamed[@]}"; do
                [ "$pr" = "$bad" ] && keep=0
              done
              [ "$keep" = "1" ] && remaining+=("$pr")
            done
            active=("${remaining[@]+"${remaining[@]}"}")

            if [ "${#active[@]}" -eq 0 ]; then
              echo "::error title=qcom-next::every PR in the batch conflicted; nothing left to validate"
              emit_dropped "[]"
              exit 1
            fi

            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$limit" ]; then
              echo "::error title=qcom-next::still conflicting after ${limit} attempt(s)"
              emit_dropped "[]"
              exit 1
            fi
          done

          jq -s -c . "$workspace/dropped.jsonl" > "$workspace/dropped.json"

          {
            echo "base_sha=$base_sha"
            echo "merged_sha=$merged_sha"
            echo "prs_json=$(cat "$workspace/prs.json")"
            echo "dropped_json=$(cat "$workspace/dropped.json")"
            echo "attempts=$attempt"
          } >> "$GITHUB_OUTPUT"

      - name: Add logs to kernel-topics
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/kernel-topics
          mkdir -p qcom-next
          cp topic_SHA1 qcom-next
          cp ../merge.log qcom-next/

          # Only record topic_conflict when it actually names a conflicting
          # topic. log-parser.sh writes a "Name / SHA" header even when nothing
          # conflicted, and without --pass automerge may not write the file at
          # all, so test the data rows rather than the file's existence. The
          # same header filter as qcom_next_topics.py read_conflicts() is used.
          # A clean candidate must also drop any stale copy inherited from the
          # baseline tree, otherwise the tag would claim a conflict that this
          # run did not hit.
          conflict_rows=0
          if [ -f topic_conflict ]; then
            conflict_rows="$(awk 'NF && $1 != "Name" && $1 !~ /^-/' topic_conflict | wc -l)"
          fi
          echo "topic_conflict data rows: ${conflict_rows}"

          # The pinned config that produced this candidate, recorded under a
          # fixed name so consumers do not have to know which config a run used.
          # This commit is the tip that gets pushed as the candidate and later
          # published to qcom-next, so the manifest lands inside every qcom-next
          # tag. Unlike topic_SHA1 it carries the per-topic `tag`, which is what
          # a promotion diff needs to report only the topics whose pin actually
          # changed.
          cp "$GITHUB_WORKSPACE/kernel-config/qcom-next.yaml" qcom-next/topics.yaml

          sed -i 's/\r$//' qcom-next/merge.log
          sed -i -E 's#https://x-access-token:[^/@[:space:]]+@github\.com/#https://x-access-token:***@github.com/#g' qcom-next/merge.log
          sed -i -E 's#https://[^/@[:space:]]+@github\.com/#https://***@github.com/#g' qcom-next/merge.log
          git add qcom-next/merge.log qcom-next/topic_SHA1 qcom-next/topics.yaml
          if [ "$conflict_rows" -gt 0 ]; then
            cp topic_conflict qcom-next/
            git add qcom-next/topic_conflict
          else
            rm -f qcom-next/topic_conflict
            git rm --cached --ignore-unmatch --quiet qcom-next/topic_conflict
          fi
          git commit -m "Add qcom-next log files for $(date '+%Y%m%d')" -m "Adding merge log file, topic_SHA1 file and topics.yaml pin manifest" -s

      # Runs even when the build failed, so a PR that conflicted is still
      # labelled and explained rather than silently retried next cycle.
      - name: Block PRs dropped for a merge conflict
        if: always() && steps.build.outputs.dropped_json != '' && steps.build.outputs.dropped_json != '[]'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DROPPED_JSON: ${{ steps.build.outputs.dropped_json }}
          SURVIVORS_JSON: ${{ steps.build.outputs.prs_json }}
          BLOCK_LABEL: qcom-next-conflict
        with:
          github-token: ${{ secrets.PAT || secrets.SPAT || github.token }}
          script: |
            const dropped = JSON.parse(process.env.DROPPED_JSON || '[]');
            const survivors = JSON.parse(process.env.SURVIVORS_JSON || '[]');
            const label = process.env.BLOCK_LABEL;

            const kept = survivors.map((pr) => `#${pr.number}`).join(', ');

            for (const item of dropped) {
              const topics = item.topics.map((t) => '`' + t + '`').join(', ');
              const body = [
                '<!-- qcom-next-conflict -->',
                `### Dropped from the qcom-next batch: merge conflict`,
                '',
                `Topic branch ${topics} could not be merged into the qcom-next`,
                'integration branch, so this PR was removed from the batch and the',
                'candidate was rebuilt without it.',
                '',
                kept
                  ? `The rest of the batch continued: ${kept}.`
                  : 'No other PR in the batch survived.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Rebase the topic branch to resolve the conflict, then remove the',
                `\`${label}\` label to let the dispatcher pick this PR up again.`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body,
              });

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  labels: [label],
                });
              } catch (error) {
                core.warning(`could not label #${item.number}: ${error.message}`);
              }
            }

            core.summary.addHeading('qcom-next: PRs dropped for merge conflicts', 3);
            core.summary.addTable([
              [
                { data: 'PR', header: true },
                { data: 'Conflicting topic', header: true },
              ],
              ...dropped.map((item) => [
                `#${item.number}`,
                item.topics.join(', '),
              ]),
            ]);
            await core.summary.write();

      - name: Push the candidate
        id: push
        env:
          GH_PUSH_TOKEN: ${{ secrets.SPAT }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PUSH_TOKEN:-}" ]; then
            echo "::error title=qcom-next::SPAT is needed to push the candidate to ${KERNEL_REPO}"
            exit 1
          fi

          if [ -n "$PR" ]; then
            ref="qcom-next-candidate-${PR}"
          else
            ref="qcom-next-candidate-batch-${{ github.run_id }}"
          fi

          cd kernel-topics
          sha="$(git rev-parse refs/heads/qcom-next)"
          git remote remove candidate 2>/dev/null || true
          git remote add candidate \
              "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${KERNEL_REPO}.git"
          git push --force candidate "refs/heads/qcom-next:refs/heads/${ref}"
          git remote remove candidate

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pushed ${KERNEL_REPO} ${ref} @ ${sha:0:12}"

      - name: Store candidate metadata
        id: metadata
        env:
          PRS_JSON: ${{ steps.build.outputs.prs_json }}
          KERNEL_CONFIG_BASE_SHA: ${{ steps.build.outputs.base_sha }}
          KERNEL_CONFIG_MERGED_SHA: ${{ steps.build.outputs.merged_sha }}
          CANDIDATE_REF: ${{ steps.push.outputs.ref }}
          CANDIDATE_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          metadata_path="${{ runner.temp }}/qcom-next-metadata.json"
          s3_key="qcom-next/ci/${{ github.run_id }}/metadata.json"

          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg kernel_config_base_sha "$KERNEL_CONFIG_BASE_SHA" \
            --arg kernel_config_merged_sha "$KERNEL_CONFIG_MERGED_SHA" \
            --arg candidate_repo "$KERNEL_REPO" \
            --arg candidate_ref "$CANDIDATE_REF" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg s3_bucket "$S3_BUCKET" \
            --arg s3_key "$s3_key" \
            --argjson prs "$PRS_JSON" \
            '{schema_version: 1, run_id: $run_id, run_attempt: $run_attempt, kernel_config_base_sha: $kernel_config_base_sha, kernel_config_merged_sha: $kernel_config_merged_sha, prs: $prs, candidate: {repo: $candidate_repo, ref: $candidate_ref, sha: $candidate_sha}, metadata: {s3_bucket: $s3_bucket, s3_key: $s3_key}}' \
            > "$metadata_path"

          aws s3 cp "$metadata_path" "s3://${S3_BUCKET}/${s3_key}"
          echo "s3_key=$s3_key" >> "$GITHUB_OUTPUT"

      - name: Comment CI metadata run id on PRs
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PRS_JSON: ${{ steps.build.outputs.prs_json }}
          CANDIDATE_REF: ${{ steps.push.outputs.ref }}
          CANDIDATE_SHA: ${{ steps.push.outputs.sha }}
          S3_KEY: ${{ steps.metadata.outputs.s3_key }}
        with:
          github-token: ${{ secrets.PAT || secrets.SPAT || github.token }}
          script: |
            const prs = JSON.parse(process.env.PRS_JSON);
            const body = [
              '<!-- qcom-next-ci-metadata -->',
              'qcom-next CI metadata is ready.',
              '',
              `Run ID: ${context.runId}`,
              `Candidate: ${process.env.CANDIDATE_REF} @ ${process.env.CANDIDATE_SHA}`,
              `S3 key: ${process.env.S3_KEY}`,
              '',
              'qcom-next is published automatically if all CI tests pass. Use this Run ID with the qcom-next publish workflow for a manual republish if needed.'
            ].join('\n');

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f kernel-topics/qcom-next/topic_SHA1 ]; then
            echo "### qcom-next candidate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated branch: ${{ steps.push.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated SHA: ${{ steps.push.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Metadata S3 key: ${{ steps.metadata.outputs.s3_key }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The tree was not built; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-candidate
          path: |
            merge.log
            kernel-topics/qcom-next/merge.log
            kernel-topics/qcom-next/topic_SHA1
            kernel-topics/qcom-next/topics.yaml
          if-no-files-found: warn
          retention-days: 14

  premerge:
    name: pre_merge
    needs: candidate
    uses: ./.github/workflows/pre_merge.yml
    secrets: inherit
    with:
      repo: qualcomm-linux/kernel
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}
      pr: "0"
      evaluate_results: false

  yocto:
    name: pre_merge_yocto
    needs: candidate
    uses: ./.github/workflows/pre-merge-yocto.yml
    secrets: inherit
    with:
      repo: qualcomm-linux/kernel
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}

  test-results:
    name: Evaluate qcom-next test results
    if: always()
    needs: [candidate, premerge, yocto]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4

      # The candidate is validated by two pipelines that upload to different
      # prefixes, so collect both here rather than leaving them in the nested
      # run summaries.
      - name: Summarise candidate artifacts
        if: always()
        env:
          CANDIDATE_REF: ${{ needs.candidate.outputs.ref }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          KBDEV_LOCATION: ${{ needs.premerge.outputs.s3_location }}
          YOCTO_LOCATION: ${{ needs.yocto.outputs.artifacts_location }}
        run: |
          set -euo pipefail

          row() {
            local label="$1" location="$2" url
            if [ -n "$location" ]; then
              url="${ARTIFACT_BASE_URL}/${S3_BUCKET}/${location}/"
              printf '| %s | [%s](%s) | `s3://%s/%s/` |\n' \
                "$label" "$url" "$url" "$S3_BUCKET" "$location"
            else
              printf '| %s | not uploaded | - |\n' "$label"
            fi
          }

          # Both pipelines default to the same owner/repo/run-attempt prefix, so
          # in one run they usually resolve to a single location.
          locations=()
          if [ -n "$KBDEV_LOCATION" ] && [ "$KBDEV_LOCATION" = "$YOCTO_LOCATION" ]; then
            rows="$(row 'kbdev + Yocto' "$KBDEV_LOCATION")"
            locations=("$KBDEV_LOCATION")
          else
            rows="$(row kbdev "$KBDEV_LOCATION"; row Yocto "$YOCTO_LOCATION")"
            if [ -n "$KBDEV_LOCATION" ]; then
              locations+=("$KBDEV_LOCATION")
            fi
            if [ -n "$YOCTO_LOCATION" ]; then
              locations+=("$YOCTO_LOCATION")
            fi
          fi

          {
            echo "### qcom-next candidate artifacts"
            echo ""
            echo "Candidate: \`${CANDIDATE_REF}\` @ \`${CANDIDATE_SHA}\`"
            echo ""
            echo "| Pipeline | Artifacts | AWS S3 path |"
            echo "| --- | --- | --- |"
            echo "$rows"
            if [ ${#locations[@]} -gt 0 ]; then
              echo ""
              echo "<details><summary>Download the artifacts</summary>"
              echo ""
              echo '```sh'
              for location in "${locations[@]}"; do
                echo "wget -r -np -nH --cut-dirs=3 ${ARTIFACT_BASE_URL}/${S3_BUCKET}/${location}/"
                echo "aws s3 cp --recursive s3://${S3_BUCKET}/${location}/ ."
              done
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build expected LAVA target lists
        id: expected_targets
        run: |
          set -euo pipefail
          # A target without "build_types" stays enabled for every build type.
          machines_for() {
            jq -c --arg build_type "$1" '
              [
                .[]
                | select(.rootfs != "" and ((.branches | not) or (.branches | index("qcom-next-staging"))))
                | select((.build_types | not) or (.build_types | index($build_type)))
                | .machine
              ]
              | unique
            ' ci/MACHINES.json
          }
          kbdev_machines="$(machines_for kbdev)"
          yocto_machines="$(machines_for yocto)"
          echo "kbdev_multimedia=$(jq -c '[.[] | "kbdev-\(.)-multimedia"]' <<< "$kbdev_machines")" >> "$GITHUB_OUTPUT"
          echo "yocto_multimedia=$(jq -c '[.[] | "yocto-\(.)-multimedia"]' <<< "$yocto_machines")" >> "$GITHUB_OUTPUT"
          echo "yocto_proprietary=$(jq -c '[.[] | "yocto-\(.)-proprietary"]' <<< "$yocto_machines")" >> "$GITHUB_OUTPUT"

      - name: Download kbdev multimedia result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Tests-kbdev-*-multimedia
          path: lava-results/kbdev-multimedia
          merge-multiple: true

      - name: Download Yocto multimedia result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Tests-yocto-*-multimedia
          path: lava-results/yocto-multimedia
          merge-multiple: true

      - name: Download Yocto proprietary result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Tests-yocto-*-proprietary
          path: lava-results/yocto-proprietary
          merge-multiple: true

      - name: Generate kbdev multimedia test result summary
        if: always()
        id: kbdev_multimedia
        uses: ./.github/actions/evaluate_lava_results
        with:
          known_failures_file: pre-merge-known-failures.yaml
          branch: qcom-next
          results_dir: lava-results/kbdev-multimedia
          expected_targets: ${{ steps.expected_targets.outputs.kbdev_multimedia }}
          summary_title: "qcom-next: kbdev multimedia test results"
          summary_file_name: qcom-next-kbdev-multimedia.md

      - name: Generate Yocto multimedia test result summary
        if: always()
        id: yocto_multimedia
        uses: ./.github/actions/evaluate_lava_results
        with:
          known_failures_file: pre-merge-known-failures.yaml
          branch: qcom-next
          results_dir: lava-results/yocto-multimedia
          expected_targets: ${{ steps.expected_targets.outputs.yocto_multimedia }}
          summary_title: "qcom-next: Yocto multimedia test results"
          summary_file_name: qcom-next-yocto-multimedia.md

      - name: Generate Yocto proprietary test result summary
        if: always()
        id: yocto_proprietary
        uses: ./.github/actions/evaluate_lava_results
        with:
          known_failures_file: pre-merge-known-failures.yaml
          branch: qcom-next
          results_dir: lava-results/yocto-proprietary
          expected_targets: ${{ steps.expected_targets.outputs.yocto_proprietary }}
          summary_title: "qcom-next: Yocto proprietary test results"
          summary_file_name: qcom-next-yocto-proprietary.md

      - name: Mark candidate failure as unexpected
        if: always() && needs.candidate.result != 'success'
        env:
          KBDEV_SUMMARY_FILE: ${{ steps.kbdev_multimedia.outputs.summary_file }}
          YOCTO_MULTIMEDIA_SUMMARY_FILE: ${{ steps.yocto_multimedia.outputs.summary_file }}
          YOCTO_PROPRIETARY_SUMMARY_FILE: ${{ steps.yocto_proprietary.outputs.summary_file }}
        run: |
          set -euo pipefail
          for summary_file in "$KBDEV_SUMMARY_FILE" "$YOCTO_MULTIMEDIA_SUMMARY_FILE" "$YOCTO_PROPRIETARY_SUMMARY_FILE"; do
            [ -f "$summary_file" ] || continue
            {
              echo ""
              echo "#### Candidate failure"
              echo "- \`candidate\` workflow completed with \`${{ needs.candidate.result }}\`."
            } >> "$summary_file"
          done

      - name: Post test result summaries on PRs
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PRS_JSON: ${{ needs.candidate.outputs.prs_json }}
          KBDEV_SUMMARY_FILE: ${{ steps.kbdev_multimedia.outputs.summary_file }}
          YOCTO_MULTIMEDIA_SUMMARY_FILE: ${{ steps.yocto_multimedia.outputs.summary_file }}
          YOCTO_PROPRIETARY_SUMMARY_FILE: ${{ steps.yocto_proprietary.outputs.summary_file }}
        with:
          github-token: ${{ secrets.PAT || secrets.SPAT || github.token }}
          script: |
            const fs = require('fs');

            const prsRaw = process.env.PRS_JSON || '';
            if (!prsRaw) {
              core.warning('No kernel-config PR list was available; skipping PR failure summary comment.');
              return;
            }

            const prs = JSON.parse(prsRaw);
            const reports = [
              {
                name: 'kbdev multimedia',
                summaryFile: process.env.KBDEV_SUMMARY_FILE,
              },
              {
                name: 'Yocto multimedia',
                summaryFile: process.env.YOCTO_MULTIMEDIA_SUMMARY_FILE,
              },
              {
                name: 'Yocto proprietary',
                summaryFile: process.env.YOCTO_PROPRIETARY_SUMMARY_FILE,
              },
            ];

            for (const pr of prs) {
              for (const report of reports) {
                const body = report.summaryFile && fs.existsSync(report.summaryFile)
                  ? fs.readFileSync(report.summaryFile, 'utf8')
                  : `### qcom-next: ${report.name} test results\n\nResult evaluation did not complete; see the workflow logs.`;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }

      - name: Fail qcom-next test results
        if: always() && (steps.kbdev_multimedia.outputs.failed == '1' || steps.yocto_multimedia.outputs.failed == '1' || steps.yocto_proprietary.outputs.failed == '1' || needs.candidate.result != 'success' || needs.premerge.result != 'success' || needs.yocto.result != 'success')
        run: exit 1

  publish:
    name: Publish qcom-next
    needs: test-results
    uses: ./.github/workflows/qcom-next_publish.yml
    secrets: inherit
    with:
      run_id: ${{ github.run_id }}
