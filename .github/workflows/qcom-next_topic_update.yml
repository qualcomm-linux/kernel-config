---
# Reusable qcom-next topic update pipeline.
#
# Wrappers call this for automatic PR validation and manual multi-PR runs.
name: _qcom-next_topic_update

on:
  workflow_call:
    inputs:
      pr_number:
        description: kernel-config PR number containing qcom-next.yaml changes
        type: string
        required: false
        default: ""
      pr_numbers:
        description: JSON array of kernel-config PR numbers to merge and validate in one batch
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # qcom-next candidate generation updates shared refs/cache state, so serialize
  # all automatic and manual invocations instead of canceling in-flight runs.
  group: qcom-next-topic-update
  cancel-in-progress: false

env:
  # Candidates live in the kernel repo because that is where the CI/CD
  # workflows can run: pre_merge.yml only runs its test job for
  # qualcomm-linux/kernel.
  KERNEL_REPO: qualcomm-linux/kernel
  TOPICS_REPO: qualcomm-linux/kernel-topics
  AUTOMERGE_REPO: sgaud-quic/automerge

jobs:
  candidate:
    name: Build and push the candidate
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [self-hosted, kernel-prd-u2404-x64-large-od-ephem]
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4
        with:
          path: kernel-config
          fetch-depth: 0

      - name: Merge kernel-config PRs
        env:
          PR: ${{ inputs.pr_number }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
        run: |
          set -euo pipefail
          cd kernel-config
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "$PR" ]; then
            prs=("$PR")
          else
            mapfile -t prs < <(jq -r '.[]' <<< "$PR_NUMBERS")
          fi

          for pr in "${prs[@]}"; do
            echo "Merging kernel-config PR #$pr"
            git fetch origin "pull/${pr}/head:pr-${pr}"
            git merge --no-ff --no-edit "pr-${pr}"
          done

      - name: Checkout automerge
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOMERGE_REPO }}
          path: automerge
          ref: sha_config_yaml
          token: ${{ secrets.SPAT || github.token }}

      - name: Checkout kernel-topics
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOPICS_REPO }}
          path: kernel-topics
          # Full history and tags: a pinned sha is often behind the branch tip,
          # and after a rebase it is only reachable through its tag.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SPAT || github.token }}

      - name: Run Automerge
        run:  |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/kernel-topics
          test -f $GITHUB_WORKSPACE/kernel-config/qcom-next.conf
          echo $GITHUB_WORKSPACE/kernel-config/qcom-next.yaml
          $GITHUB_WORKSPACE/automerge/ci-merge --yaml-config $GITHUB_WORKSPACE/kernel-config/qcom-next.yaml -t head -i qcom-next -c https://github.com/sgaud-quic/cache -n -p | tee $GITHUB_WORKSPACE/merge.log

      - name: Parse and Add logs
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/kernel-topics
          mkdir qcom-next
          $GITHUB_WORKSPACE/automerge/log-parser.sh $GITHUB_WORKSPACE/merge.log
          cp topic_SHA1 qcom-next
          cp ../merge.log qcom-next/
          sed -i 's/\r$//' qcom-next/merge.log
          sed -i -E 's#https://x-access-token:[^/@[:space:]]+@github\.com/#https://x-access-token:***@github.com/#g' qcom-next/merge.log
          sed -i -E 's#https://[^/@[:space:]]+@github\.com/#https://***@github.com/#g' qcom-next/merge.log
          git config user.email "sgaud@qti.qualcomm.com"
          git config user.name  "Salendarsingh Gaud"
          git add qcom-next/merge.log qcom-next/topic_SHA1
          git commit -m "Add qcom-next log files for $(date '+%Y%m%d')" -m "Adding merge log file and topic_SHA1 file" -s

      - name: Push the candidate
        id: push
        env:
          GH_PUSH_TOKEN: ${{ secrets.SPAT }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PUSH_TOKEN:-}" ]; then
            echo "::error title=qcom-next::SPAT is needed to push the candidate to ${KERNEL_REPO}"
            exit 1
          fi

          if [ -n "$PR" ]; then
            ref="qcom-next-candidate-${PR}"
          else
            ref="qcom-next-candidate-batch-${{ github.run_id }}"
          fi

          cd kernel-topics
          sha="$(git rev-parse refs/heads/qcom-next)"
          git remote remove candidate 2>/dev/null || true
          git remote add candidate \
              "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${KERNEL_REPO}.git"
          git push --force candidate "refs/heads/qcom-next:refs/heads/${ref}"
          git remote remove candidate

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pushed ${KERNEL_REPO} ${ref} @ ${sha:0:12}"

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f kernel-topics/qcom-next/topic_SHA1 ]; then
            echo "### qcom-next candidate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated branch: ${{ steps.push.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated SHA: ${{ steps.push.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The tree was not built; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-candidate
          path: |
            merge.log
            kernel-topics/qcom-next/merge.log
            kernel-topics/qcom-next/topic_SHA1
          if-no-files-found: warn
          retention-days: 14

  premerge:
    name: pre_merge
    needs: candidate
    uses: ./.github/workflows/pre_merge.yml
    secrets: inherit
    with:
      repo: qualcomm-linux/kernel
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}
      pr: "0"

  yocto:
    name: pre_merge_yocto
    needs: candidate
    uses: ./.github/workflows/pre-merge-yocto.yml
    secrets: inherit
    with:
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}
