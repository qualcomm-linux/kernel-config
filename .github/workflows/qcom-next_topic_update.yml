---
# Reusable qcom-next topic update pipeline.
#
# Wrappers call this for automatic PR validation and manual multi-PR runs.
name: _qcom-next_topic_update

on:
  workflow_call:
    inputs:
      pr_number:
        description: kernel-config PR number containing qcom-next.yaml changes
        type: string
        required: false
        default: ""
      pr_numbers:
        description: JSON array of kernel-config PR numbers to merge and validate in one batch
        type: string
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # qcom-next candidate generation updates shared refs/cache state, so serialize
  # all automatic and manual invocations instead of canceling in-flight runs.
  group: qcom-next-topic-update
  cancel-in-progress: false

env:
  # Candidates live in the staging kernel repo for validation before publish.
  KERNEL_REPO: qualcomm-linux-stg/kernel
  TOPICS_REPO: qualcomm-linux/kernel-topics
  AUTOMERGE_REPO: sgaud-quic/automerge
  S3_BUCKET: qli-prd-kernel-gh-artifacts

jobs:
  candidate:
    name: Build and push the candidate
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [self-hosted, kernel-prd-u2404-x64-large-od-ephem]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    outputs:
      ref: ${{ steps.push.outputs.ref }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4
        with:
          path: kernel-config
          fetch-depth: 0

      - name: Merge kernel-config PRs
        id: merge_prs
        env:
          PR: ${{ inputs.pr_number }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
        run: |
          set -euo pipefail
          cd kernel-config
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          base_sha="$(git rev-parse HEAD)"

          if [ -n "$PR" ]; then
            prs=("$PR")
          else
            mapfile -t prs < <(jq -r '.[]' <<< "$PR_NUMBERS")
          fi

          for pr in "${prs[@]}"; do
            echo "Merging kernel-config PR #$pr"
            git fetch origin "pull/${pr}/head:pr-${pr}"
            head_sha="$(git rev-parse "pr-${pr}")"
            git merge --no-ff --no-edit "pr-${pr}"
            merge_sha="$(git rev-parse HEAD)"
            jq -n \
              --arg number "$pr" \
              --arg head_sha "$head_sha" \
              --arg merge_sha "$merge_sha" \
              '{number: ($number | tonumber), head_sha: $head_sha, merge_sha: $merge_sha}' >> ../prs.jsonl
          done

          merged_sha="$(git rev-parse HEAD)"
          prs_json="$(jq -s -c . ../prs.jsonl)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
          echo "prs_json=$prs_json" >> "$GITHUB_OUTPUT"

      - name: Checkout automerge
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOMERGE_REPO }}
          path: automerge
          ref: sha_config_yaml
          token: ${{ secrets.SPAT || github.token }}

      - name: Checkout kernel-topics
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOPICS_REPO }}
          path: kernel-topics
          # Full history and tags: a pinned sha is often behind the branch tip,
          # and after a rebase it is only reachable through its tag.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SPAT || github.token }}

      - name: Run Automerge
        run:  |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/kernel-topics
          test -f $GITHUB_WORKSPACE/kernel-config/qcom-next.conf
          echo $GITHUB_WORKSPACE/kernel-config/qcom-next.yaml
          $GITHUB_WORKSPACE/automerge/ci-merge --yaml-config $GITHUB_WORKSPACE/kernel-config/qcom-next.yaml -t head -i qcom-next -c https://github.com/sgaud-quic/cache -n -p | tee $GITHUB_WORKSPACE/merge.log

      - name: Parse and Add logs
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/kernel-topics
          mkdir qcom-next
          $GITHUB_WORKSPACE/automerge/log-parser.sh $GITHUB_WORKSPACE/merge.log
          cp topic_SHA1 qcom-next
          cp ../merge.log qcom-next/
          sed -i 's/\r$//' qcom-next/merge.log
          sed -i -E 's#https://x-access-token:[^/@[:space:]]+@github\.com/#https://x-access-token:***@github.com/#g' qcom-next/merge.log
          sed -i -E 's#https://[^/@[:space:]]+@github\.com/#https://***@github.com/#g' qcom-next/merge.log
          git config user.email "sgaud@qti.qualcomm.com"
          git config user.name  "Salendarsingh Gaud"
          git add qcom-next/merge.log qcom-next/topic_SHA1
          git commit -m "Add qcom-next log files for $(date '+%Y%m%d')" -m "Adding merge log file and topic_SHA1 file" -s

      - name: Push the candidate
        id: push
        env:
          GH_PUSH_TOKEN: ${{ secrets.SPAT }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PUSH_TOKEN:-}" ]; then
            echo "::error title=qcom-next::SPAT is needed to push the candidate to ${KERNEL_REPO}"
            exit 1
          fi

          if [ -n "$PR" ]; then
            ref="qcom-next-candidate-${PR}"
          else
            ref="qcom-next-candidate-batch-${{ github.run_id }}"
          fi

          cd kernel-topics
          sha="$(git rev-parse refs/heads/qcom-next)"
          git remote remove candidate 2>/dev/null || true
          git remote add candidate \
              "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${KERNEL_REPO}.git"
          git push --force candidate "refs/heads/qcom-next:refs/heads/${ref}"
          git remote remove candidate

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pushed ${KERNEL_REPO} ${ref} @ ${sha:0:12}"

      - name: Store candidate metadata
        id: metadata
        env:
          PRS_JSON: ${{ steps.merge_prs.outputs.prs_json }}
          KERNEL_CONFIG_BASE_SHA: ${{ steps.merge_prs.outputs.base_sha }}
          KERNEL_CONFIG_MERGED_SHA: ${{ steps.merge_prs.outputs.merged_sha }}
          CANDIDATE_REF: ${{ steps.push.outputs.ref }}
          CANDIDATE_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          metadata_path="${{ runner.temp }}/qcom-next-metadata.json"
          s3_key="qcom-next/ci/${{ github.run_id }}/metadata.json"

          jq -n \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg kernel_config_base_sha "$KERNEL_CONFIG_BASE_SHA" \
            --arg kernel_config_merged_sha "$KERNEL_CONFIG_MERGED_SHA" \
            --arg candidate_repo "$KERNEL_REPO" \
            --arg candidate_ref "$CANDIDATE_REF" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg s3_bucket "$S3_BUCKET" \
            --arg s3_key "$s3_key" \
            --argjson prs "$PRS_JSON" \
            '{schema_version: 1, run_id: $run_id, run_attempt: $run_attempt, kernel_config_base_sha: $kernel_config_base_sha, kernel_config_merged_sha: $kernel_config_merged_sha, prs: $prs, candidate: {repo: $candidate_repo, ref: $candidate_ref, sha: $candidate_sha}, metadata: {s3_bucket: $s3_bucket, s3_key: $s3_key}}' \
            > "$metadata_path"

          aws s3 cp "$metadata_path" "s3://${S3_BUCKET}/${s3_key}"
          echo "s3_key=$s3_key" >> "$GITHUB_OUTPUT"

      - name: Comment CI metadata run id on PRs
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PRS_JSON: ${{ steps.merge_prs.outputs.prs_json }}
          CANDIDATE_REF: ${{ steps.push.outputs.ref }}
          CANDIDATE_SHA: ${{ steps.push.outputs.sha }}
          S3_KEY: ${{ steps.metadata.outputs.s3_key }}
        with:
          github-token: ${{ secrets.PAT || secrets.SPAT || github.token }}
          script: |
            const prs = JSON.parse(process.env.PRS_JSON);
            const body = [
              '<!-- qcom-next-ci-metadata -->',
              'qcom-next CI metadata is ready.',
              '',
              `Run ID: ${context.runId}`,
              `Candidate: ${process.env.CANDIDATE_REF} @ ${process.env.CANDIDATE_SHA}`,
              `S3 key: ${process.env.S3_KEY}`,
              '',
              'qcom-next is published automatically if all CI tests pass. Use this Run ID with the qcom-next publish workflow for a manual republish if needed.'
            ].join('\n');

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f kernel-topics/qcom-next/topic_SHA1 ]; then
            echo "### qcom-next candidate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated branch: ${{ steps.push.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated SHA: ${{ steps.push.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Metadata S3 key: ${{ steps.metadata.outputs.s3_key }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The tree was not built; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-candidate
          path: |
            merge.log
            kernel-topics/qcom-next/merge.log
            kernel-topics/qcom-next/topic_SHA1
          if-no-files-found: warn
          retention-days: 14

  premerge:
    name: pre_merge
    needs: candidate
    uses: ./.github/workflows/pre_merge.yml
    secrets: inherit
    with:
      repo: qualcomm-linux-stg/kernel
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}
      pr: "0"

  yocto:
    name: pre_merge_yocto
    needs: candidate
    uses: ./.github/workflows/pre-merge-yocto.yml
    secrets: inherit
    with:
      repo: qualcomm-linux-stg/kernel
      ref: ${{ needs.candidate.outputs.ref }}
      sha: ${{ needs.candidate.outputs.sha }}

  test-results:
    name: Evaluate qcom-next test results
    if: always()
    needs: [premerge, yocto]
    runs-on: ubuntu-latest
    steps:
      - name: Download LAVA result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Tests-*
          path: lava-results
          merge-multiple: true

      - name: Check test results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(lava-results/*.json)
          failed=0

          {
            echo "### qcom-next test result"
            echo ""
            echo "| Gate | Workflow result |"
            echo "| --- | --- |"
            echo "| pre_merge | ${{ needs.premerge.result }} |"
            echo "| pre_merge_yocto | ${{ needs.yocto.result }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.premerge.result }}" != "success" ] || [ "${{ needs.yocto.result }}" != "success" ]; then
            failed=1
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No LAVA result JSON artifacts were found." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=qcom-next::No LAVA result JSON artifacts were found"
            exit 1
          fi

          {
            echo "| Target | Pass | Non-pass | Total |"
            echo "| --- | :---: | :---: | :---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          for file in "${files[@]}"; do
            target="$(basename "$file" .json)"
            target="${target#Tests-}"
            total="$(jq 'length' "$file")"
            pass="$(jq '[.[] | select(.result == "pass")] | length' "$file")"
            non_pass="$(jq '[.[] | select(.result != "pass")] | length' "$file")"

            printf '| %s | %s | %s | %s |\n' "$target" "$pass" "$non_pass" "$total" >> "$GITHUB_STEP_SUMMARY"

            if [ "$total" -eq 0 ] || [ "$non_pass" -ne 0 ]; then
              failed=1
              jq -r --arg target "$target" '.[] | select(.result != "pass") | "::error title=qcom-next::\($target): \(.name) => \(.result)"' "$file"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "qcom-next result: failed"
            exit 1
          fi

          echo "qcom-next result: passed"

  publish:
    name: Publish qcom-next
    needs: test-results
    uses: ./.github/workflows/qcom-next_publish.yml
    secrets: inherit
    with:
      run_id: ${{ github.run_id }}
