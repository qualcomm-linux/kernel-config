---
name: _loading
description: Load required parameters for the subsequent jobs

on:
  workflow_call:
    inputs:
      branch:
        description: Target branch used to filter test targets
        type: string
        required: false
        default: ""

      build_type:
        description: Build type used to filter test targets (kbdev or yocto)
        type: string
        required: false
        default: ""

      repo:
        description: Target repository, used to detect topic branches
        type: string
        required: false
        default: ""
    outputs:
      build_matrix:
        description: Build matrix
        value: ${{ jobs.loading.outputs.build_matrix }}

      full_matrix:
        description: Full Matrix containing lava description
        value: ${{ jobs.loading.outputs.full_matrix }}

      bootbins:
        description: Bootbins to generate Flat Build
        value: ${{ jobs.loading.outputs.bootbins }}

      ubuntu_matrix:
        description: Ubuntu matrix
        value: ${{ jobs.loading.outputs.ubuntu_matrix }}

      rootfs_matrix:
        description: Rootfs matrix for Yocto
        value: ${{ jobs.loading.outputs.rootfs_matrix }}

      lava_enabled:
        description: Whether LAVA tests are enabled for the branch
        value: ${{ jobs.loading.outputs.lava_enabled }}

      axiom_enabled:
        description: Whether Axiom tests are enabled for the branch
        value: ${{ jobs.loading.outputs.axiom_enabled }}

jobs:
  loading:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.loading.outputs.build_matrix }}
      full_matrix: ${{ steps.loading.outputs.full_matrix }}
      bootbins: ${{ steps.loading.outputs.bootbins }}
      ubuntu_matrix: ${{ steps.loading.outputs.ubuntu_matrix }}
      rootfs_matrix: ${{ steps.loading.outputs.rootfs_matrix }}
      lava_enabled: ${{ steps.loading.outputs.lava_enabled }}
      axiom_enabled: ${{ steps.loading.outputs.axiom_enabled }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Parameters
        id: loading
        uses: ./.github/actions/loading
        with:
          branch: ${{ inputs.branch }}
          build_type: ${{ inputs.build_type }}
          repo: ${{ inputs.repo }}
