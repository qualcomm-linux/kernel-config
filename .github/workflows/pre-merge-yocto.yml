---
name: pre_merge_yocto
run-name: Compile Yocto Build

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: string
        required: true
      sha:
        description: Head sha of the PR
        type: string
        required: true
      ref:
        description: Target branch
        type: string
        required: true
      repo:
        description: Target repository
        type: string
        required: true
      base:
        description: base build or tip
        type: string
        default: tag
        required: true
      pr_list:
        description: list of open PR's
        type: string
        default: ''
        required: false

jobs:
  init-status:
    name: Initialize Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set Status
        uses: ./.github/actions/workflow_status
        with:
          sha: ${{ github.event.inputs.sha || github.sha }}
          action_mode: start
          check_name: "Yocto Build Generation"
          repo: ${{ github.event.inputs.repo || github.repository }}
          GH_TOKEN: ${{ secrets.PAT }}

  yocto-config:
    name: Load Yocto Workflow Config
    runs-on: ubuntu-latest
    needs: init-status
    outputs:
      build_enabled: ${{ steps.check.outputs.build_enabled }}
      test_enabled: ${{ steps.check.outputs.test_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci/WORKFLOWS.json
          sparse-checkout-cone-mode: false

      - name: Check branch enablement
        id: check
        uses: actions/github-script@v7
        env:
          INPUT_BRANCH: ${{ inputs.ref }}
        with:
          script: |
            const fs = require('fs');
            const branch = process.env.INPUT_BRANCH || '';
            let cfg = {};
            try {
              cfg = JSON.parse(fs.readFileSync('ci/WORKFLOWS.json', 'utf-8'));
            } catch (e) {
              core.warning(`Could not read ci/WORKFLOWS.json: ${e.message}. Defaulting to enabled.`);
              core.setOutput('build_enabled', 'true');
              core.setOutput('test_enabled', 'true');
              return;
            }
            const wf = cfg['pre_merge_yocto'] || {};
            const buildBranches = wf['build_branches'] || [];
            const testBranches  = wf['test_branches']  || [];
            const buildEnabled = buildBranches.length === 0 || buildBranches.includes(branch);
            const testEnabled  = testBranches.length  === 0 || testBranches.includes(branch);
            console.log(`branch=${branch} build_enabled=${buildEnabled} test_enabled=${testEnabled}`);
            core.setOutput('build_enabled', String(buildEnabled));
            core.setOutput('test_enabled',  String(testEnabled));

  loading:
    name: Load Parameters
    needs: [init-status, yocto-config]
    if: needs.yocto-config.outputs.build_enabled == 'true'
    uses: ./.github/workflows/loading.yml
    secrets: inherit
    with:
      branch: ${{ inputs.ref }}

  build_yocto:
    name: Build Yocto
    needs: [init-status, yocto-config, loading]
    if: needs.yocto-config.outputs.build_enabled == 'true'
    uses: ./.github/workflows/build-yocto.yml
    secrets: inherit
    with:
      repo: ${{ inputs.repo || 'qualcomm-linux/kernel' }}
      ref: ${{ inputs.ref || 'qcom-next-staging' }}
      sha: ${{ inputs.sha }}
      rootfs_matrix: ${{ needs.loading.outputs.rootfs_matrix }}
      base: ${{ inputs.base }}
      pr_list: ${{ inputs.pr_list }}
      upload_artifacts: ${{ needs.yocto-config.outputs.test_enabled }}

  check_run:
    runs-on: ubuntu-latest
    needs: [init-status, yocto-config, loading, build_yocto]
    if: needs.yocto-config.outputs.test_enabled == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Post check run
        uses: ./.github/actions/check_run
        with:
          sha: ${{ inputs.sha }}
          repo: ${{ inputs.repo }}
          s3_location: ${{ needs.build_yocto.outputs.artifacts_location }}
          workflow_name: " for ${{ github.workflow }}"
          APPID: ${{ secrets.APPID }}
          PVK: ${{ secrets.PVK }}

  test:
    needs: [init-status, yocto-config, loading, build_yocto]
    if: needs.yocto-config.outputs.test_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        image_type: [multimedia, proprietary]
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      docker_image: ${{ vars.TECH_TEAM_NAMESPACE }}/kmake-image:${{ vars.KMAKE_IMAGE_VERSION }}
      rootfs_matrix: ${{ needs.loading.outputs.rootfs_matrix }}
      kernel_version: ${{ needs.build_yocto.outputs.kernel_version }}
      commit_SHA: ${{ inputs.sha }}
      branch: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr }}
      flash_type: "qdl"
      build_type: "yocto"
      image_type: ${{ matrix.image_type }}

  premerge_report:
    name: Pre-merge LAVA Test Report
    if: always() && needs.yocto-config.outputs.test_enabled == 'true'
    needs: [yocto-config, build_yocto, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download all test JSON artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Tests-*
          path: all-json
          merge-multiple: true

      - name: Download all job info artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: job_info_*
          path: job-info

      - name: Generate report
        run: |
          set -e
          INPUT_DIR="all-json"

          sha="${{ inputs.sha }}"
          short_sha="${sha:0:7}"
          commit_url="https://github.com/${{ inputs.repo }}/commit/${sha}"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          s3_location="${{ needs.build_yocto.outputs.artifacts_location }}"
          s3_path="N/A"
          if [ -n "$s3_location" ]; then
            s3_path="s3://qli-prd-kernel-gh-artifacts/${s3_location}/"
          fi

          declare -A JOB_URLS=()
          job_info_re='^- \[([^[:space:]]+) Job [^]]+ on ([^]]+)\]\(([^)]*)\)'
          mapfile -t JOB_INFO_FILES < <(find job-info -type f -name '*.md' 2>/dev/null | sort || true)
          if [ ${#JOB_INFO_FILES[@]} -gt 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ $job_info_re ]]; then
                image_type="${BASH_REMATCH[1]}"
                machine="${BASH_REMATCH[2]}"
                job_url="${BASH_REMATCH[3]}"
                JOB_URLS["${machine}-${image_type}"]="$job_url"
              fi
            done < <(cat "${JOB_INFO_FILES[@]}")
          fi

          {
            echo "# Yocto Build and Test Report"
            echo ""
            echo "## Build Artifacts"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| AWS S3 Path | \`${s3_path}\` |"
            echo "| Commit | [\`${short_sha}\`](${commit_url}) |"
            echo "| Run | [${run_url}](${run_url}) |"
            echo ""

            mapfile -t FILES < <(ls "$INPUT_DIR"/*.json 2>/dev/null || true)
            if [ ${#FILES[@]} -gt 0 ]; then
              echo "## Test Matrix"
              echo ""

              TARGETS=()
              for f in "${FILES[@]}"; do
                TARGETS+=("$(basename "$f" .json | sed 's/^Tests-//')")
              done

              TESTS=$(jq -r '.[].name' "${FILES[@]}" | sort -u)

              printf "| Test Case "
              for t in "${TARGETS[@]}"; do
                target_label="$t"
                if [ -n "${JOB_URLS[$t]:-}" ]; then
                  target_label="[$t](${JOB_URLS[$t]})"
                fi
                printf "| %s " "$target_label"
              done
              printf "|\n"

              printf "| --- "
              for _ in "${TARGETS[@]}"; do printf "| :---: "; done
              printf "|\n"

              while IFS= read -r test; do
                printf "| %s " "$test"
                for t in "${TARGETS[@]}"; do
                  res=$(jq -r --arg n "$test" '.[] | select(.name==$n) | .result' "$INPUT_DIR/Tests-${t}.json" 2>/dev/null || true)
                  case "$res" in
                    pass)  cell="✅" ;;
                    fail)  cell="❌" ;;
                    skip)  cell="⚠️" ;;
                    error) cell="⛔" ;;
                    *)     cell="➖" ;;
                  esac
                  printf "| %s " "$cell"
                done
                printf "|\n"
              done <<< "$TESTS"

              echo ""
              echo "## Summary"
              echo ""
              printf "| Target | ✅ Pass | ❌ Fail | ⚠️ Skip | Total |\n"
              printf "| --- | :---: | :---: | :---: | :---: |\n"
              for t in "${TARGETS[@]}"; do
                f="$INPUT_DIR/Tests-${t}.json"
                total=$(jq 'length' "$f" 2>/dev/null || echo 0)
                total="${total:-0}"
                if [ "$total" -eq 0 ]; then
                  printf "| %s | ➖ | ➖ | ➖ | N/A (Incomplete) |\n" "$t"
                else
                  pass=$(jq '[.[] | select(.result=="pass")] | length' "$f")
                  fail=$(jq '[.[] | select(.result=="fail")] | length' "$f")
                  skip=$(jq '[.[] | select(.result=="skip")] | length' "$f")
                  printf "| %s | %s | %s | %s | %s |\n" "$t" "$pass" "$fail" "$skip" "$total"
                fi
              done

            else
              echo "## Test Matrix"
              echo ""
              echo "No test result artifacts were found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  final-status:
    name: Finalize Status
    if: always()
    runs-on: ubuntu-latest
    needs: [yocto-config, build_yocto, check_run, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set final status
        uses: ./.github/actions/workflow_status
        with:
          sha: ${{ github.event.inputs.sha || github.sha }}
          action_mode: ${{ needs.build_yocto.result == 'skipped' && 'success' || (needs.test.result != 'skipped' && needs.test.result || needs.build_yocto.result) }}
          check_name: "Yocto Build Generation"
          repo: ${{ github.event.inputs.repo || github.repository }}
          GH_TOKEN: ${{ secrets.PAT }}
