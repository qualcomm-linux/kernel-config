name: Kernel Checkers
run-name: "${{ format('kernel-checker: {0} - PR #{1}', inputs.repo, inputs.pr) }}"
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: string
        required: true
      sha:
        description: Head sha of the PR
        type: string
        required: true
      ref:
        description: Target branch
        type: string
        required: true
      repo:
        description: Target repository
        type: string
        required: true
      rerere_cache:
        description: >
          Shared rerere cache that automerge reads when building the tree.
          Override to try a different cache; it must be the cache the
          conflict resolutions were recorded in, or they are not replayed.
        type: string
        required: false
        default: https://github.com/sgaud-quic/kernel-rrcache

jobs:
  init-status:
    runs-on: ubuntu-latest
    steps:
      - name: Initial workflow status
        uses: qualcomm-linux/kernel-config/.github/actions/workflow_status@main
        with:
          sha: ${{ inputs.sha }}
          action_mode: start
          check_name: kernel-checker
          repo: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.PAT }}

  checker:
    needs: [init-status]
    uses: qualcomm-linux/kernel-checkers/.github/workflows/checker.yml@test_ci_v2
    secrets: inherit
    with:
      check_name: ${{ matrix.check }}
      base_branch: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr }}
      topic_repo: ${{ inputs.repo }}
      # The checkers build their tree from qcom-next.yaml. Read it from the
      # kernel-config branch this run was dispatched on, so a test branch is
      # checked against its own pins rather than main's.
      config_repo: ${{ github.repository }}
      config_ref: ${{ github.ref_name }}
      rerere_cache: ${{ inputs.rerere_cache }}
    strategy:
      matrix:
        check: [check-patch-compliance, check-uapi-headers, sparse-check, checkpatch,
          dt-binding-check, dtb-check]
      fail-fast: false
  
  final-status:
    runs-on: ubuntu-latest
    needs: [checker]
    if: always()
    steps:
      - name: Final workflow status
        uses: qualcomm-linux/kernel-config/.github/actions/workflow_status@main
        with:
          sha: ${{ inputs.sha }}
          action_mode: ${{ needs.checker.result }}
          check_name: kernel-checker
          repo: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.PAT }}
