name: _test
description: Run tests on LAVA

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      rootfs_matrix:
        description: Full matrix containing lava description
        type: string
        required: true

      kernel_version:
        description: Kernel Version
        type: string
        required: true

      commit_SHA:
        description: Kernel Commit SHA
        type: string
        required: true

      branch:
        description: Kernel branch name
        type: string
        required: true

      pr_number:
        description: PR number
        type: string
        required: true

      flash_type:
        description: Flash method fastboot or qdl
        type: string
        required: true

      build_type:
        description: Build type kbdev or yocto
        type: string
        required: true

      image_type:
        description: Yocto qcomflash image type
        type: string
        required: false
        default: multimedia

jobs:
  boot_test:
    name: Boot ${{ matrix.rootfs_matrix.machine }} ${{ inputs.image_type }}
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [ self-hosted, kernel-prd-u2404-x64-large-od-ephem ]
    strategy:
      fail-fast: false
      matrix:
        rootfs_matrix: ${{ fromJson(inputs.rootfs_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Download URLs list
        if: ${{ inputs.build_type == 'kbdev' }}
        uses: actions/download-artifact@v4
        with:
          name: presigned_urls.json
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Download URLs list
        if: ${{ inputs.build_type == 'yocto' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{matrix.rootfs_matrix.rootfs}}_presigned_urls.json
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Clone lava job render scripts
        run: cd .. && git clone https://github.com/sgaud-quic/job_render

      - name: Decide flash_type
        id: flash
        shell: bash
        run: |
          if [ -n "${{ inputs.flash_type }}" ]; then
            flash_type="${{ inputs.flash_type }}"
          else
            flash_type="${{ matrix.rootfs_matrix.flash_type }}"
          fi
          echo "flash_type=$flash_type" >> "$GITHUB_OUTPUT"
          echo "Flash_type : $flash_type"

      - name: Create lava boot job definition
        uses: ./.github/actions/lava_job_render
        id: create_job_definition
        with:
          docker_image: ${{ inputs.docker_image }}
          kernel_version: ${{ inputs.kernel_version }}
          commit_SHA: ${{ inputs.commit_SHA }}
          branch: ${{ inputs.branch }}
          pr_number: ${{ inputs.pr_number }}
          flash_type: ${{ steps.flash.outputs.flash_type }}
          build_type: ${{ inputs.build_type }}
          image_type: ${{ inputs.image_type }}
          test_stage: boot
        env:
          FIRMWARE: ${{ matrix.rootfs_matrix.firmwareid }}
          MACHINE: ${{ matrix.rootfs_matrix.machine }}
          LAVA_NAME: ${{ matrix.rootfs_matrix.lavaname }}
          rootfs: ${{ matrix.rootfs_matrix.rootfs }}

      - name: Submit lava boot job
        id: submit_job
        run: |
          set -euo pipefail
          cd ../job_render
          submit_output="$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs submit ./renders/lava_job_definition.yaml" 2>&1)" || {
            echo "$submit_output"
            echo "summary=:x: Lava boot job submission failed." >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "$submit_output"
          job_id="$(echo "$submit_output" | awk '/^[0-9]+$/ { id=$1 } END { print id }')"
          if [ -z "$job_id" ]; then
            echo "ERROR: LAVA submission did not return a numeric job ID."
            echo "$submit_output"
            echo "summary=:x: Lava boot job submission failed." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"
          echo "job_id=$job_id" >> $GITHUB_OUTPUT
          echo "job_url=$job_url" >> $GITHUB_OUTPUT
          echo "Lava Boot Job: $job_url"
          echo "JOB_ID=$job_id" >> $GITHUB_ENV

      - name: Check lava boot job results
        id: check_job
        if: steps.submit_job.outputs.job_id != ''
        run: |
          STATE=""
          START_TIME=$(date +%s)
          while [ "$STATE" != "Finished" ]; do
            raw=$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs show $JOB_ID" 2>&1 || true)
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$(((CURRENT_TIME - START_TIME)/3600))
            if [ $ELAPSED_TIME -ge 2 ]; then
              echo "Timeout: 2 hours exceeded."
              summary=":x: Lava boot job exceeded time limit."
              echo "summary=$summary" >> $GITHUB_OUTPUT
              exit 1
            fi
            state_line=$(echo "$raw" | grep -i "^state" || true)
            if [ -z "$state_line" ]; then
              echo "Warning: could not retrieve job state, retrying in 30s..."
              echo "$raw"
              sleep 30
              continue
            fi
            STATE=$(echo "$state_line" | cut -d':' -f2 | sed 's/^ *//;s/ *$//')
            echo "Current status: $STATE"
            if [ "$STATE" != "Finished" ]; then
              sleep 30
            fi
          done
          HEALTH=""
          for attempt in 1 2 3; do
            health_raw=$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs show $JOB_ID" 2>&1 || true)
            health_line=$(echo "$health_raw" | grep "Health" || true)
            HEALTH=$(echo "$health_line" | cut -d':' -f2 | sed 's/^ *//;s/ *$//')
            if [ -n "$HEALTH" ]; then
              break
            fi
            echo "Warning: could not retrieve job health (attempt $attempt/3), retrying in 10s..."
            echo "$health_raw"
            sleep 10
          done
          echo "Job health: $HEALTH"
          if [[ "$HEALTH" == "Complete" ]]; then
            echo "Lava boot job completed."
            summary=":heavy_check_mark: Lava boot job completed."
            echo "summary=$summary" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Lava boot job failed."
            summary=":x: Lava boot job failed."
            echo "summary=$summary" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Fetch LAVA boot result JSON
        if: (success() || failure()) && steps.submit_job.outputs.job_id != ''
        run: |
          set -euo pipefail
          MACHINE="${{ matrix.rootfs_matrix.machine }}"
          IMAGE_TYPE="${{ inputs.image_type }}"
          RESULT="fail"
          if [ "${{ steps.check_job.conclusion }}" = "success" ]; then
            RESULT="pass"
          fi
          mkdir -p lava-results
          jq -n --arg result "$RESULT" '[{name: "boot", result: $result}]' > "lava-results/Tests-${{ inputs.build_type }}-${MACHINE}-${IMAGE_TYPE}-boot.json"

      - name: Update boot summary
        if: success() || failure()
        shell: bash
        run: |
          if [ "${{ steps.create_job_definition.conclusion }}" == 'failure' ]; then
            status=":x: Boot job definition failed"
          elif [ "${{ steps.submit_job.conclusion }}" == 'failure' ]; then
            status="${{ steps.submit_job.outputs.summary }}"
            job_url=""
            job_id=""
          else
            status="${{ steps.check_job.outputs.summary }}"
            job_url="${{ steps.submit_job.outputs.job_url }}"
            job_id="${{ steps.submit_job.outputs.job_id }}"
          fi
          JOB_INFO="- [${{ inputs.image_type }} Boot Job $job_id on ${{ matrix.rootfs_matrix.machine }}]($job_url) - $status"
          echo -e "$JOB_INFO" > boot_job_info.md

      - name: Upload Boot Job Info Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot_job_info_${{ inputs.build_type }}_${{ matrix.rootfs_matrix.machine }}_${{ inputs.image_type }}
          path: boot_job_info.md

      - name: Upload Boot Lava Json File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-${{ inputs.build_type }}-${{ matrix.rootfs_matrix.machine }}-${{ inputs.image_type }}-boot
          path: lava-results/*.json

  playlist_test:
    name: Test ${{ matrix.rootfs_matrix.machine }} ${{ inputs.image_type }}
    needs: boot_test
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [ self-hosted, kernel-prd-u2404-x64-large-od-ephem ]
    strategy:
      fail-fast: false
      matrix:
        rootfs_matrix: ${{ fromJson(inputs.rootfs_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Download URLs list
        if: ${{ inputs.build_type == 'kbdev' }}
        uses: actions/download-artifact@v4
        with:
          name: presigned_urls.json
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Download URLs list
        if: ${{ inputs.build_type == 'yocto' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{matrix.rootfs_matrix.rootfs}}_presigned_urls.json
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Clone lava job render scripts
        run: cd .. && git clone https://github.com/qualcomm-linux/job_render

      - name: Decide flash_type
        id: flash
        shell: bash
        run: |
          if [ -n "${{ inputs.flash_type }}" ]; then
            flash_type="${{ inputs.flash_type }}"
          else
            flash_type="${{ matrix.rootfs_matrix.flash_type }}"
          fi
          echo "flash_type=$flash_type" >> "$GITHUB_OUTPUT"
          echo "Flash_type : $flash_type"

      - name: Create lava playlist job definition
        uses: ./.github/actions/lava_job_render
        id: create_job_definition
        with:
          docker_image: ${{ inputs.docker_image }}
          kernel_version: ${{ inputs.kernel_version }}
          commit_SHA: ${{ inputs.commit_SHA }}
          branch: ${{ inputs.branch }}
          pr_number: ${{ inputs.pr_number }}
          flash_type: ${{ steps.flash.outputs.flash_type }}
          build_type: ${{ inputs.build_type }}
          image_type: ${{ inputs.image_type }}
          test_stage: playlist
        env:
          FIRMWARE: ${{ matrix.rootfs_matrix.firmwareid }}
          MACHINE: ${{ matrix.rootfs_matrix.machine }}
          LAVA_NAME: ${{ matrix.rootfs_matrix.lavaname }}
          rootfs: ${{ matrix.rootfs_matrix.rootfs }}

      - name: Submit lava playlist job
        id: submit_job
        run: |
          set -euo pipefail
          cd ../job_render
          submit_output="$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs submit ./renders/lava_job_definition.yaml" 2>&1)" || {
            echo "$submit_output"
            echo "summary=:x: Lava playlist job submission failed." >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "$submit_output"
          job_id="$(echo "$submit_output" | awk '/^[0-9]+$/ { id=$1 } END { print id }')"
          if [ -z "$job_id" ]; then
            echo "ERROR: LAVA submission did not return a numeric job ID."
            echo "$submit_output"
            echo "summary=:x: Lava playlist job submission failed." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"
          echo "job_id=$job_id" >> $GITHUB_OUTPUT
          echo "job_url=$job_url" >> $GITHUB_OUTPUT
          echo "Lava Playlist Job: $job_url"
          echo "JOB_ID=$job_id" >> $GITHUB_ENV

      - name: Check lava playlist job results
        id: check_job
        if: steps.submit_job.outputs.job_id != ''
        run: |
          STATE=""
          START_TIME=$(date +%s)
          while [ "$STATE" != "Finished" ]; do
            raw=$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs show $JOB_ID" 2>&1 || true)
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$(((CURRENT_TIME - START_TIME)/3600))
            if [ $ELAPSED_TIME -ge 2 ]; then
              echo "Timeout: 2 hours exceeded."
              summary=":x: Lava playlist job exceeded time limit."
              echo "summary=$summary" >> $GITHUB_OUTPUT
              exit 1
            fi
            state_line=$(echo "$raw" | grep -i "^state" || true)
            if [ -z "$state_line" ]; then
              echo "Warning: could not retrieve job state, retrying in 30s..."
              echo "$raw"
              sleep 30
              continue
            fi
            STATE=$(echo "$state_line" | cut -d':' -f2 | sed 's/^ *//;s/ *$//')
            echo "Current status: $STATE"
            if [ "$STATE" != "Finished" ]; then
              sleep 30
            fi
          done
          HEALTH=""
          for attempt in 1 2 3; do
            health_raw=$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs show $JOB_ID" 2>&1 || true)
            health_line=$(echo "$health_raw" | grep "Health" || true)
            HEALTH=$(echo "$health_line" | cut -d':' -f2 | sed 's/^ *//;s/ *$//')
            if [ -n "$HEALTH" ]; then
              break
            fi
            echo "Warning: could not retrieve job health (attempt $attempt/3), retrying in 10s..."
            echo "$health_raw"
            sleep 10
          done
          echo "Job health: $HEALTH"
          if [[ "$HEALTH" == "Complete" ]]; then
            echo "Lava playlist job completed."
            summary=":heavy_check_mark: Lava playlist job completed."
            echo "summary=$summary" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Lava playlist job failed."
            summary=":x: Lava playlist job failed."
            echo "summary=$summary" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Fetch LAVA playlist results JSON
        if: (success() || failure()) && steps.submit_job.outputs.job_id != ''
        id: fetch_results
        run: |
          set -e
          MACHINE="${{ matrix.rootfs_matrix.machine }}"
          IMAGE_TYPE="${{ inputs.image_type }}"
          IN="results.json"

          mkdir -p lava-results

          curl -s "https://lava-oss.qualcomm.com/api/v0.2/jobs/$JOB_ID/tests/?limit=500" > results.json
          echo "Downloaded results to results.json"
          jq '.[0] ? // . | length' results.json || true

          SUITE_ID=$(curl -s "https://lava-oss.qualcomm.com/api/v0.2/jobs/$JOB_ID/suites/" \
            | jq -r '.results[] | select(.name != "lava") | .id' \
            | head -n 1)
          echo "Premerge suite id: $SUITE_ID"

          if [ -z "$SUITE_ID" ]; then
            echo "No playlist suite found."
            echo '[]' > "lava-results/Tests-${{ inputs.build_type }}-${MACHINE}-${IMAGE_TYPE}-playlist.json"
            exit 0
          fi

          jq --argjson suite_id "${SUITE_ID}" '
            (if type=="object" and .results then .results else . end)
              | map(select(.suite == $suite_id))
              | map(select(.result == "pass" or .result == "fail" or .result == "skip" or .result == "error"))
              | map({
                      name: .name,
                      result: .result
                  })
              ' "$IN" > "lava-results/Tests-${{ inputs.build_type }}-${MACHINE}-${IMAGE_TYPE}-playlist.json"

      - name: Update playlist summary
        if: success() || failure()
        shell: bash
        run: |
          if [ "${{ steps.create_job_definition.conclusion }}" == 'failure' ]; then
            status=":x: Test job failed"
          elif [ "${{ steps.submit_job.conclusion }}" == 'failure' ]; then
            status="${{ steps.submit_job.outputs.summary }}"
            job_url=""
            job_id=""
          else
            status="${{ steps.check_job.outputs.summary }}"
            job_url="${{ steps.submit_job.outputs.job_url }}"
            job_id="${{ steps.submit_job.outputs.job_id }}"
          fi
          JOB_INFO="- [${{ inputs.image_type }} Job $job_id on ${{ matrix.rootfs_matrix.machine }}]($job_url) - $status"
          echo -e "$JOB_INFO" > job_info.md

      - name: Upload Playlist Job Info Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job_info_${{ inputs.build_type }}_${{ matrix.rootfs_matrix.machine }}_${{ inputs.image_type }}_playlist
          path: job_info.md

      - name: Upload Playlist Lava Json File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-${{ inputs.build_type }}-${{ matrix.rootfs_matrix.machine }}-${{ inputs.image_type }}-playlist
          path: lava-results/*.json
