name: _test
description: Run tests on LAVA

on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true

      rootfs_matrix:
        description: Full matrix containing lava description
        type: string
        required: true

      kernel_version:
        description: Kernel Version
        type: string
        required: true

      commit_SHA:
        description: Kernel Commit SHA
        type: string
        required: true

      branch:
        description: Kernel branch name
        type: string
        required: true

      pr_number:
        description: PR number
        type: string
        required: true

      flash_type:
        description: Flash method fastboot or qdl
        type: string
        required: true

      build_type:
        description: Build type kbdev or yocto
        type: string
        required: true

      image_type:
        description: Yocto qcomflash image type
        type: string
        required: false
        default: multimedia

jobs:
  test:
    name: Test ${{ matrix.rootfs_matrix.machine }} ${{ inputs.image_type }}
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [ self-hosted, kernel-prd-u2404-x64-large-od-ephem ]
    strategy:
      fail-fast: false
      matrix:
        rootfs_matrix: ${{ fromJson(inputs.rootfs_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pull docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Download URLs list
        if: ${{ inputs.build_type == 'kbdev' }}
        uses: actions/download-artifact@v4
        with:
          name: presigned_urls.json
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Download URLs list
        if: ${{ inputs.build_type == 'yocto' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{matrix.rootfs_matrix.rootfs}}_presigned_urls.json
          merge-multiple: true
          path: ${{ github.workspace }}

      - name: Clone lava job render scripts
        run: cd .. && git clone https://github.com/qualcomm-linux/job_render

      - name: Decide flash_type
        id: flash
        shell: bash
        run: |
          if [ -n "${{ inputs.flash_type }}" ]; then
            echo "flash_type=${{ inputs.flash_type }}" >> "$GITHUB_OUTPUT"
          else
            echo "flash_type=${{ matrix.rootfs_matrix.flash_type }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Flash_type : $flash_type"

      - name: Create lava job definition
        uses: qualcomm-linux/kernel-config/.github/actions/lava_job_render@main
        id: create_job_definition
        with:
          docker_image: ${{ inputs.docker_image }}
          kernel_version: ${{ inputs.kernel_version }}
          commit_SHA: ${{ inputs.commit_SHA }}
          branch: ${{ inputs.branch }}
          pr_number: ${{ inputs.pr_number }}
          flash_type: ${{ steps.flash.outputs.flash_type }}
          build_type: ${{ inputs.build_type }}
          image_type: ${{ inputs.image_type }}
        env:
          FIRMWARE: ${{ matrix.rootfs_matrix.firmwareid }}
          MACHINE: ${{ matrix.rootfs_matrix.machine }}
          LAVA_NAME: ${{ matrix.rootfs_matrix.lavaname }}
          rootfs: ${{ matrix.rootfs_matrix.rootfs }}

      - name: Submit lava job
        id: submit_job
        run: |
          set -euo pipefail
          cd ../job_render
          submit_output="$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs submit ./renders/lava_job_definition.yaml" 2>&1)" || {
            echo "$submit_output"
            echo "summary=:x: Lava job submission failed." >> "$GITHUB_OUTPUT"
            exit 1
          }
          echo "$submit_output"
          job_id="$(echo "$submit_output" | awk '/^[0-9]+$/ { id=$1 } END { print id }')"
          if [ -z "$job_id" ]; then
            echo "ERROR: LAVA submission did not return a numeric job ID."
            echo "$submit_output"
            echo "summary=:x: Lava job submission failed." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          job_url="https://lava-oss.qualcomm.com/scheduler/job/$job_id"
          echo "job_id=$job_id" >> $GITHUB_OUTPUT
          echo "job_url=$job_url" >> $GITHUB_OUTPUT
          echo "Lava Job: $job_url"
          echo "JOB_ID=$job_id" >> $GITHUB_ENV

      - name: Check lava job results
        id: check_job
        if: steps.submit_job.outputs.job_id != ''
        run: |
          STATE=""
          START_TIME=$(date +%s)
          while [ "$STATE" != "Finished" ]; do
            raw=$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs show $JOB_ID" 2>&1 || true)
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$(((CURRENT_TIME - START_TIME)/3600))
            if [ $ELAPSED_TIME -ge 2 ]; then
              echo "Timeout: 2 hours exceeded."
              summary=":x: Lava job exceeded time limit."
              echo "summary=$summary" >> $GITHUB_OUTPUT
              exit 1
            fi
            state_line=$(echo "$raw" | grep -i "^state" || true)
            if [ -z "$state_line" ]; then
              echo "Warning: could not retrieve job state, retrying in 30s..."
              echo "$raw"
              sleep 30
              continue
            fi
            STATE=$(echo "$state_line" | cut -d':' -f2 | sed 's/^ *//;s/ *$//')
            echo "Current status: $STATE"
            if [ "$STATE" != "Finished" ]; then
              sleep 30
            fi
          done
          HEALTH=""
          for attempt in 1 2 3; do
            health_raw=$(docker run -i --rm --workdir="$PWD" -v "$(dirname $PWD)":"$(dirname $PWD)" ${{ inputs.docker_image }} sh -c "lavacli identities add --token ${{ secrets.LAVA_OSS_TOKEN }} --uri https://lava-oss.qualcomm.com/RPC2 --username ${{ secrets.LAVA_OSS_USER }} production && lavacli -i production jobs show $JOB_ID" 2>&1 || true)
            health_line=$(echo "$health_raw" | grep "Health" || true)
            HEALTH=$(echo "$health_line" | cut -d':' -f2 | sed 's/^ *//;s/ *$//')
            if [ -n "$HEALTH" ]; then
              break
            fi
            echo "Warning: could not retrieve job health (attempt $attempt/3), retrying in 10s..."
            echo "$health_raw"
            sleep 10
          done
          echo "Job health: $HEALTH"
          if [[ "$HEALTH" == "Complete" ]]; then
            echo "Lava job completed."
            summary=":heavy_check_mark: Lava job completed."
            echo "summary=$summary" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Lava job failed."
            summary=":x: Lava job failed."
            echo "summary=$summary" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Fetch LAVA results JSON
        if: (success() || failure()) && steps.submit_job.outputs.job_id != ''
        id: fetch_results
        env:
          TEST_BUILD_TYPE: ${{ inputs.build_type }}
          TEST_MACHINE: ${{ matrix.rootfs_matrix.machine }}
          TEST_IMAGE_TYPE: ${{ inputs.image_type }}
        run: |
          set -euo pipefail
          mkdir -p lava-results
          export_path="lava-results/Tests-${TEST_BUILD_TYPE}-${TEST_MACHINE}-${TEST_IMAGE_TYPE}.json"
          if python3 scripts/lava_results.py \
              --job-id "$JOB_ID" \
              --definition ../job_render/renders/lava_job_definition.yaml \
              --output-dir lava-results/evidence \
              --export "$export_path"; then
            echo "summary=:heavy_check_mark: Lava testcase results complete with no failures." >> "$GITHUB_OUTPUT"
          else
            echo "summary=:x: Lava testcase failure or incomplete result evidence." >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Update summary
        if: success() || failure()
        shell: bash
        env:
          JOB_CREATION_CONCLUSION: ${{ steps.create_job_definition.conclusion }}
          SUBMISSION_CONCLUSION: ${{ steps.submit_job.conclusion }}
          SUBMISSION_SUMMARY: ${{ steps.submit_job.outputs.summary }}
          COMPLETION_CONCLUSION: ${{ steps.check_job.conclusion }}
          COMPLETION_SUMMARY: ${{ steps.check_job.outputs.summary }}
          TESTCASE_SUMMARY: ${{ steps.fetch_results.outputs.summary }}
          LAVA_JOB_URL: ${{ steps.submit_job.outputs.job_url }}
          LAVA_JOB_ID: ${{ steps.submit_job.outputs.job_id }}
          TEST_MACHINE: ${{ matrix.rootfs_matrix.machine }}
          TEST_IMAGE_TYPE: ${{ inputs.image_type }}
        run: |
          if [ "$JOB_CREATION_CONCLUSION" == 'failure' ]; then
            status=":x: Test job failed"
          elif [ "$SUBMISSION_CONCLUSION" == 'failure' ]; then
            status="$SUBMISSION_SUMMARY"
            job_url=""
            job_id=""
          else
            if [ "$COMPLETION_CONCLUSION" == 'success' ]; then
              status="$TESTCASE_SUMMARY"
            else
              status="$COMPLETION_SUMMARY"
            fi
            job_url="$LAVA_JOB_URL"
            job_id="$LAVA_JOB_ID"
          fi
          JOB_INFO="- [$TEST_IMAGE_TYPE Job $job_id on $TEST_MACHINE]($job_url)"
          printf '%s: %s\n' "$JOB_INFO" "$status" > job_info.md

      - name: Upload Job Info Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job_info_${{ inputs.build_type }}_${{ matrix.rootfs_matrix.machine }}_${{ inputs.image_type }}
          path: job_info.md

      - name: Upload Lava Json File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tests-${{ inputs.build_type }}-${{ matrix.rootfs_matrix.machine }}-${{ inputs.image_type }}
          path: lava-results/*.json

      - name: Upload LAVA result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LAVA-Evidence-${{ inputs.build_type }}-${{ matrix.rootfs_matrix.machine }}-${{ inputs.image_type }}
          path: lava-results/evidence/
