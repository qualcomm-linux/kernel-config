name: _build
on:
  workflow_call:
    inputs:
      docker_image:
        description: Docker image
        type: string
        required: true
      pr_number:
        description: PR number
        type: string
        required: false
      branch:
        description: Branch name
        type: string
        required: false
      repo:
        description: Target repository
        type: string
        required: true
      rootfs_matrix:
        description: Rootfs matrix
        type: string
        required: true
      variant:
        description: Build variant (RT or default)
        type: string
        required: true

    outputs:
      s3_location:
        description: "S3 location of uploaded artifacts"
        value: ${{ jobs.upload.outputs.s3_location }}
      kernel_version:
        description: "Kernel version built"
        value: ${{ jobs.build.outputs.kernel_version }}

jobs:
  build:
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [ self-hosted, kernel-prd-u2404-x64-large-od-ephem ]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    outputs:
      kernel_version: ${{ steps.build_workspace.outputs.kernel_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync codebase
        id: sync
        uses: qualcomm-linux/kernel-config/.github/actions/sync@main
        with:
          base_branch: ${{ inputs.branch }}
          pr_number: ${{ inputs.pr_number}}
          GH_TOKEN: ${{ secrets.PAT }}
          repo: ${{ inputs.repo }}

      - name: Pull docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build workspace
        id: build_workspace
        uses: qualcomm-linux/kernel-config/.github/actions/build@main
        with:
          docker_image: ${{ inputs.docker_image }}
          workspace_path: ${{ steps.sync.outputs.workspace_path }}
          variant: ${{ inputs.variant }}

      - name: Package build outputs for flat-meta jobs
        shell: bash
        run: |
          set -euo pipefail
          workspace="${{ steps.sync.outputs.workspace_path }}"
          base_dir="${{ runner.temp }}/base-artifacts"
          kobj_stage="${{ runner.temp }}/kobj-stage"
          mkdir -p "$base_dir/dtbs" "$kobj_stage/kobj/arch/arm64/boot/dts/qcom"

          cp -a "$workspace/../kobj/tar-install" "$kobj_stage/kobj/"
          mkdir -p "$kobj_stage/kobj/arch/arm64/boot"
          cp "$workspace/../kobj/arch/arm64/boot/Image" "$kobj_stage/kobj/arch/arm64/boot/Image"
          cp "$workspace/../kobj/vmlinux" "$kobj_stage/kobj/vmlinux"

          machines="$(echo '${{ inputs.rootfs_matrix }}' | jq -r '.[].machine' | sort -u)"
          for machine in $machines; do
            cp "$workspace/../kobj/arch/arm64/boot/dts/qcom/${machine}.dtb" "$kobj_stage/kobj/arch/arm64/boot/dts/qcom/${machine}.dtb"
            cp "$workspace/../kobj/arch/arm64/boot/dts/qcom/${machine}.dtb" "$base_dir/dtbs/${machine}.dtb"
          done

          echo '${{ inputs.rootfs_matrix }}' | jq -c '.[] | select(.hypervisor == "kvm")' | while IFS= read -r row; do
            machine="$(echo "$row" | jq -r '.machine')"
            cp "$workspace/../kobj/arch/arm64/boot/dts/qcom/${machine}-el2.dtb" "$kobj_stage/kobj/arch/arm64/boot/dts/qcom/${machine}-el2.dtb"
          done

          tar -cf "${{ runner.temp }}/kobj-min.tar" -C "$kobj_stage" kobj
          cp "$workspace/../kobj/arch/arm64/boot/Image" "$base_dir/Image"
          cp "$workspace/../kobj/vmlinux" "$base_dir/vmlinux"

      - name: Upload build base artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-base
          path: |
            ${{ runner.temp }}/base-artifacts
            ${{ runner.temp }}/kobj-min.tar
          compression-level: 0
          retention-days: 3

      - name: Update summary
        if: success() || failure()
        shell: bash
        run: |
          if [ "${{ steps.build_workspace.outcome }}" == "success" ]; then
            echo "Build was successful"
            summary=":heavy_check_mark: Build Success"
          else
            echo "Build failed"
            summary=":x: Build Failed"
          fi
          SUMMARY='
          <details><summary><i>Build Summary</i></summary>
          '${summary}'
          </details>
          '
          echo -e "$SUMMARY" >> $GITHUB_STEP_SUMMARY

  flat_build:
    needs: build
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [ self-hosted, kernel-prd-u2404-x64-large-od-ephem ]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.rootfs_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull docker image
        uses: qualcomm-linux/kernel-config/.github/actions/pull_docker_image@main
        with:
          image: ${{ inputs.docker_image }}
          registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Download build base artifact
        uses: actions/download-artifact@v4
        with:
          name: build-base
          path: ${{ runner.temp }}/build-base

      - name: Prepare workspace from build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/kernel"
          tar -xf "${{ runner.temp }}/build-base/kobj-min.tar" -C "${{ github.workspace }}"

      - name: Generate flat build
        if: ${{ matrix.target.rootfs != '' }}
        id: generate_flat_build
        uses: ./.github/actions/flat_meta_generation
        with:
          docker_image: ${{ inputs.docker_image }}
          workspace_path: ${{ github.workspace }}/kernel
          s3_bucket: qli-prd-kernel-gh-artifacts
          machine: ${{ matrix.target.machine }}
          rootfs: ${{ matrix.target.rootfs }}
          firmwareid: ${{ matrix.target.firmwareid }}
          hypervisor: ${{ matrix.target.hypervisor }}
          storage: ${{ matrix.target.storage }}

      - name: Upload flat build artifact
        if: ${{ matrix.target.rootfs != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: flat-${{ matrix.target.rootfs }}
          path: ${{ github.workspace }}/kernel/qcom-multimedia-image-${{ matrix.target.rootfs }}.rootfs.qcomflash.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  upload:
    needs: [build, flat_build]
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [ self-hosted, kernel-prd-u2404-x64-large-od-ephem ]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    outputs:
      s3_location: ${{ steps.upload-artifacts.outputs.s3_location }}
    steps:
      - name: Download build base artifact
        uses: actions/download-artifact@v4
        with:
          name: build-base
          path: ${{ runner.temp }}/build-base

      - name: Download flat build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flat-*
          path: ${{ runner.temp }}/flat-artifacts
          merge-multiple: true

      - name: Create file list for artifacts upload
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "${{ runner.temp }}/build-base/kobj-min.tar" -C "${{ runner.temp }}"
          tar -cJf "${{ runner.temp }}/build-base/base-artifacts/modules.tar.xz" -C "${{ runner.temp }}/kobj/tar-install" lib/modules

          file_list="${{ github.workspace }}/file_list.txt"
          : > "$file_list"

          echo "${{ runner.temp }}/build-base/base-artifacts/modules.tar.xz" >> "$file_list"
          echo "${{ runner.temp }}/build-base/base-artifacts/Image" >> "$file_list"
          echo "${{ runner.temp }}/build-base/base-artifacts/vmlinux" >> "$file_list"

          for dtb in "${{ runner.temp }}/build-base/base-artifacts/dtbs/"*.dtb; do
            echo "$dtb" >> "$file_list"
          done

          for flat_img in "${{ runner.temp }}/flat-artifacts/"*.tar.gz; do
            echo "$flat_img" >> "$file_list"
          done

      - name: Upload artifacts
        id: upload-artifacts
        uses: qualcomm-linux/kernel-config/.github/actions/aws_s3_helper@main
        with:
          s3_bucket: qli-prd-kernel-gh-artifacts
          local_file: ${{ github.workspace }}/file_list.txt
          mode: multi-upload

      - name: Clean up
        run: |
          rm -rf "${{ runner.temp }}/build-base"
          rm -rf "${{ runner.temp }}/flat-artifacts"
          rm -rf "${{ runner.temp }}/kobj"
          rm -rf file_list.txt

      - name: Update summary
        if: success() || failure()
        shell: bash
        run: |
          if [ "${{ steps.upload-artifacts.outcome }}" == "success" ]; then
            echo "Build was successful"
            summary=":heavy_check_mark: Build Success"
          else
            echo "Build failed"
            summary=":x: Build Failed"
          fi
          SUMMARY='
          <details><summary><i>Build Summary</i></summary>
          '${summary}'
          </details>
          '
          echo -e "$SUMMARY" >> $GITHUB_STEP_SUMMARY
