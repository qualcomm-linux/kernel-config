---
name: qcom-next promote topic

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Topic tags to promote, separated by commas, spaces or newlines, for example tech/all/dt/glymur-7.3-rc2-20261024
        type: string
        required: true
permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create qcom-next promotion PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT || secrets.SPAT || github.token }}

      - name: Resolve promotions from tags
        id: resolve
        env:
          TOPIC_TAGS: ${{ inputs.tags }}
          PROMOTIONS_FILE: ${{ runner.temp }}/promotions.json
          PUSH_TOKEN: ${{ secrets.PAT || secrets.SPAT || github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          path = "qcom-next.yaml"


          def fail(message):
              print(f"::error title=qcom-next::{message}")
              sys.exit(1)


          tags = []
          for item in re.split(r"[,\s]+", os.environ["TOPIC_TAGS"]):
              item = item.strip()
              if item and item not in tags:
                  tags.append(item)
          if not tags:
              fail("at least one tag is required")


          def unquote(result):
              if len(result) >= 2 and result[0] == result[-1] and result[0] in "\"'":
                  return result[1:-1]
              return result


          def value(line, key):
              prefix = f"    {key}:"
              if not line.startswith(prefix):
                  return None
              return unquote(line[len(prefix):].strip())


          topics = []


          def add_topic(topic_block):
              if not topic_block:
                  return
              topic = {}
              for key in ("name", "repo", "branch"):
                  for line in topic_block:
                      if key == "name" and line.startswith("  - name:"):
                          result = unquote(line[len("  - name:"):].strip())
                      else:
                          result = value(line, key)
                      if result is not None:
                          topic[key] = result
                          break
              if {"repo", "branch"} - topic.keys():
                  fail(f"malformed topic entry: {topic}")
              topics.append(topic)


          block = []
          in_topics = False
          with open(path, encoding="utf-8") as source:
              for line in source:
                  if line.startswith("topics:"):
                      in_topics = True
                      continue
                  if not in_topics:
                      continue
                  if line.startswith("  - name:"):
                      add_topic(block)
                      block = [line]
                  elif block:
                      block.append(line)
          add_topic(block)


          def resolve_topic(tag):
              matches = []
              for topic in topics:
                  for candidate in (topic.get("branch"), topic.get("name")):
                      if candidate and tag.startswith(f"{candidate}-"):
                          matches.append((len(candidate), topic))
              if not matches:
                  fail(f"tag '{tag}' does not match a topic branch in {path}")
              longest = max(length for length, _ in matches)
              selected = [topic for length, topic in matches if length == longest]
              branches = {topic["branch"] for topic in selected}
              if len(branches) != 1:
                  fail(
                      f"tag '{tag}' matches multiple topic branches: "
                      + ", ".join(sorted(branches))
                  )
              return selected[0]


          def resolve_sha(tag, repo):
              tag_ref = f"refs/tags/{tag}"
              if subprocess.run(
                  ["git", "check-ref-format", tag_ref], capture_output=True
              ).returncode:
                  fail(f"invalid tag name: {tag}")

              url = repo
              token = os.environ.get("PUSH_TOKEN", "")
              marker = "https://github.com/"
              if token and url.startswith(marker):
                  url = f"https://x-access-token:{token}@github.com/{url[len(marker):]}"

              listing = subprocess.run(
                  ["git", "ls-remote", "--tags", url, tag_ref, f"{tag_ref}^{{}}"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout

              direct = ""
              peeled = ""
              for line in listing.splitlines():
                  parts = line.split("\t")
                  if len(parts) != 2:
                      continue
                  sha, ref = parts
                  if ref == tag_ref:
                      direct = sha
                  elif ref == f"{tag_ref}^{{}}":
                      peeled = sha

              sha = (peeled or direct).strip().lower()
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  fail(f"tag '{tag}' was not found in '{repo}'")
              return sha


          promotions = []
          for tag in tags:
              topic = resolve_topic(tag)
              branch = topic["branch"]
              clash = next(
                  (item for item in promotions if item["branch"] == branch), None
              )
              if clash:
                  fail(
                      f"tags '{clash['tag']}' and '{tag}' both promote topic "
                      f"'{branch}'"
                  )
              promotions.append(
                  {
                      "tag": tag,
                      "branch": branch,
                      "repo": topic["repo"],
                      "sha": resolve_sha(tag, topic["repo"]),
                  }
              )

          for item in promotions:
              print(f"{item['branch']}: {item['tag']} -> {item['sha']}")

          with open(os.environ["PROMOTIONS_FILE"], "w", encoding="utf-8") as handle:
              json.dump(promotions, handle, indent=2)

          if len(promotions) == 1:
              safe = re.sub(r"[/\s]", "-", promotions[0]["branch"])
              safe = re.sub(r"[^A-Za-z0-9._-]", "", safe)
              pr_branch = f"tmp/qcom-next-promote-{safe}-{promotions[0]['sha'][:12]}"
          else:
              fingerprint = "\n".join(
                  f"{item['branch']}:{item['sha']}"
                  for item in sorted(promotions, key=lambda entry: entry["branch"])
              )
              digest = hashlib.sha1(fingerprint.encode("utf-8")).hexdigest()[:12]
              pr_branch = f"tmp/qcom-next-promote-{len(promotions)}-topics-{digest}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"count={len(promotions)}\n")
              output.write(f"pr_branch={pr_branch}\n")
          PY

      - name: Update qcom-next.yaml
        id: update
        env:
          PROMOTIONS_FILE: ${{ runner.temp }}/promotions.json
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_msg.txt
          PR_BODY_FILE: ${{ runner.temp }}/pr_body.md
          PR_BRANCH: ${{ steps.resolve.outputs.pr_branch }}
        run: |
          set -euo pipefail

          base_branch="${GITHUB_REF_NAME}"
          git checkout -B "$PR_BRANCH" "origin/${base_branch}"

          python3 <<'PY'
          import json
          import os
          import sys

          path = "qcom-next.yaml"


          def fail(message):
              print(f"::error title=qcom-next::{message}")
              sys.exit(1)


          with open(os.environ["PROMOTIONS_FILE"], encoding="utf-8") as handle:
              promotions = json.load(handle)

          by_branch = {item["branch"]: item for item in promotions}
          matched = set()

          with open(path, encoding="utf-8") as handle:
              lines = handle.readlines()

          out = []


          def target_of(topic_block):
              for branch, item in by_branch.items():
                  labels = (
                      f"name: {branch}",
                      f"branch: {branch}",
                      f"name: \"{branch}\"",
                      f"branch: \"{branch}\"",
                  )
                  if any(line.strip() in labels for line in topic_block):
                      return item
              return None


          def flush_topic(topic_block):
              if not topic_block:
                  return
              item = target_of(topic_block)
              if item is None:
                  out.extend(topic_block)
                  return
              matched.add(item["branch"])
              for line in topic_block:
                  stripped = line.strip()
                  if stripped.startswith("sha:"):
                      out.append(f"    sha: {item['sha']}\n")
                  elif stripped.startswith("tag:"):
                      out.append(f"    tag: {item['tag']}\n")
                  else:
                      out.append(line)


          block = []
          in_topics = False
          for line in lines:
              if line.startswith("topics:"):
                  in_topics = True
                  out.append(line)
                  continue
              if in_topics and line.startswith("  - name:"):
                  flush_topic(block)
                  block = [line]
                  continue
              if in_topics and block:
                  block.append(line)
              else:
                  out.append(line)

          flush_topic(block)

          missing = sorted(set(by_branch) - matched)
          if missing:
              fail(f"topics not found in {path}: " + ", ".join(missing))

          with open(path, "w", encoding="utf-8") as handle:
              handle.writelines(out)

          if len(promotions) == 1:
              item = promotions[0]
              subject = f"qcom-next: promote {item['branch']} to {item['tag']}"
              details = f"Update {item['branch']} to {item['sha']}.\n"
          else:
              subject = f"qcom-next: promote {len(promotions)} topics"
              details = "".join(
                  f"Update {item['branch']} to {item['sha']} ({item['tag']}).\n"
                  for item in promotions
              )

          with open(os.environ["COMMIT_MSG_FILE"], "w", encoding="utf-8") as handle:
              handle.write(f"{subject}\n\n{details}")

          rows = "".join(
              f"| `{item['branch']}` | `{item['sha']}` | `{item['tag']}` |\n"
              for item in promotions
          )
          with open(os.environ["PR_BODY_FILE"], "w", encoding="utf-8") as handle:
              handle.write(
                  "Promote qcom-next topic branches.\n"
                  "\n"
                  "| Topic branch | SHA | Tag |\n"
                  "| --- | --- | --- |\n"
                  f"{rows}"
                  "\n"
                  "This PR is generated in the base repository so qcom-next CI "
                  "can run with repository secrets.\n"
              )
          PY

          if git diff --quiet -- qcom-next.yaml; then
            echo "::notice title=qcom-next::qcom-next.yaml already contains the requested promotions"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push promotion branch
        if: steps.update.outputs.changed == 'true'
        env:
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_msg.txt
          PR_BRANCH: ${{ steps.update.outputs.pr_branch }}
          PUSH_TOKEN: ${{ secrets.PAT || secrets.SPAT || github.token }}
        run: |
          set -euo pipefail
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add qcom-next.yaml

          git commit -F "$COMMIT_MSG_FILE"

          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/${PR_BRANCH}"

      - name: Create promotion PR
        if: steps.update.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.SPAT || github.token }}
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_msg.txt
          PR_BODY_FILE: ${{ runner.temp }}/pr_body.md
          BASE_BRANCH: ${{ steps.update.outputs.base_branch }}
          PR_BRANCH: ${{ steps.update.outputs.pr_branch }}
        run: |
          set -euo pipefail
          title="$(head -n 1 "$COMMIT_MSG_FILE")"
          body="$(cat "$PR_BODY_FILE")"

          existing_url="$(curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${PR_BRANCH}&base=${BASE_BRANCH}&state=open" \
            | jq -r '.[0].html_url // empty')"
          if [ -n "$existing_url" ]; then
            echo "pr_url=$existing_url" >> "$GITHUB_OUTPUT"
            echo "Existing PR: $existing_url"
            exit 0
          fi

          payload="$(jq -n \
            --arg title "$title" \
            --arg head "$PR_BRANCH" \
            --arg base "$BASE_BRANCH" \
            --arg body "$body" \
            '{title: $title, head: $head, base: $base, body: $body}')"
          response="$(curl -sS -w '\n%{http_code}' -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "$payload")"
          http_code="$(printf '%s' "$response" | tail -n1)"
          body_json="$(printf '%s' "$response" | sed '$d')"
          if [ "$http_code" != "201" ]; then
            echo "Failed to create PR (HTTP $http_code)" >&2
            printf '%s\n' "$body_json" >&2
            exit 1
          fi
          pr_url="$(printf '%s\n' "$body_json" | jq -r '.html_url')"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Created PR: $pr_url"

      - name: Summary
        if: always()
        env:
          PROMOTIONS_FILE: ${{ runner.temp }}/promotions.json
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -uo pipefail
          echo "### qcom-next promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "${PROMOTIONS_FILE:-}" ]; then
            echo "| Topic branch | SHA | Tag |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "| `\(.branch)` | `\(.sha)` | `\(.tag)` |"' \
              "$PROMOTIONS_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No promotions were resolved; see the workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${PR_URL:-}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "PR: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
