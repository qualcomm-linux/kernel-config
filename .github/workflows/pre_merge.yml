name: pre_merge
run-name: "${{ inputs.pr != '' && inputs.pr != '0' && format('premerge: {0} - PR #{1}', inputs.repo, inputs.pr) || format('premerge: {0} @ {1}', inputs.repo, inputs.ref) }}"
on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number. Leave empty or 0 to build ref as-is.
        type: string
        required: false
        default: "0"
      sha:
        description: Commit SHA for status/check reporting. Optional for branch-only builds.
        type: string
        required: false
        default: ""
      ref:
        description: Target branch/ref. With no PR, this ref is checked out and built as-is.
        type: string
        required: true
      repo:
        description: Target repository
        type: string
        required: true
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number. Leave empty or 0 to build ref as-is.
        type: string
        required: false
        default: "0"
      sha:
        description: Commit SHA for status/check reporting. Optional for branch-only builds.
        type: string
        required: false
        default: ""
      ref:
        description: Target branch/ref. With no PR, this ref is checked out and built as-is.
        type: string
        required: true
      repo:
        description: Target repository
        type: string
        required: true

jobs:
  init-status:
    runs-on: ubuntu-latest
    steps:
      - name: Initial workflow status
        if: inputs.sha != ''
        uses: qualcomm-linux/kernel-config/.github/actions/workflow_status@main
        with:
          sha: ${{ inputs.sha }}
          action_mode: start
          check_name: pre-merge
          repo: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.PAT }}

  loading:
    needs: [init-status]
    uses: qualcomm-linux/kernel-config/.github/workflows/loading.yml@main
    secrets: inherit
    with:
      branch: ${{ inputs.ref }}

  build:
    needs: [loading, init-status]
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      docker_image: ${{ vars.TECH_TEAM_NAMESPACE }}/kmake-image:${{ vars.KMAKE_IMAGE_VERSION }}
      pr_number: ${{ inputs.pr }}
      branch: ${{ inputs.ref }}
      repo: ${{ inputs.repo }}
      rootfs_matrix: ${{ needs.loading.outputs.rootfs_matrix }}
      variant: default

  build_rt:
    needs: [loading, init-status]
    uses: ./.github/workflows/build_rt.yml
    secrets: inherit
    with:
      docker_image: ${{ vars.TECH_TEAM_NAMESPACE }}/kmake-image:${{ vars.KMAKE_IMAGE_VERSION }}
      pr_number: ${{ inputs.pr }}
      branch: ${{ inputs.ref }}
      repo: ${{ inputs.repo }}
      variant: RT

  check_run:
    if: inputs.sha != ''
    runs-on: ubuntu-latest
    needs: [init-status, loading, build]
    steps:
      - name: Post check run
        uses: qualcomm-linux/kernel-config/.github/actions/check_run@main
        with:
          sha: ${{ inputs.sha }}
          repo: ${{ inputs.repo }}
          s3_location: ${{ needs.build.outputs.s3_location }}
          APPID: ${{ secrets.APPID }}
          PVK: ${{ secrets.PVK }}

  test:
    if: inputs.repo == 'qualcomm-linux/kernel' && inputs.sha != ''
    needs: [init-status, loading, build]
    uses: qualcomm-linux/kernel-config/.github/workflows/test.yml@main
    secrets: inherit
    with:
      docker_image: ${{vars.TECH_TEAM_NAMESPACE}}/kmake-image:${{vars.KMAKE_IMAGE_VERSION}}
      rootfs_matrix: ${{ needs.loading.outputs.rootfs_matrix }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      commit_SHA: ${{ inputs.sha }}
      branch: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr }}
      flash_type: ""
      build_type: "kbdev"

  comment:
    needs: [test]
    uses: qualcomm-linux/kernel-config/.github/workflows/comment.yml@main
    if: always() && inputs.pr != '' && inputs.pr != '0' && needs.test.result != 'skipped'
    secrets: inherit
    with:
      pr_number: ${{ inputs.pr }}
      sha: ${{ inputs.sha }}
      repo: ${{ inputs.repo }}

  final-status:
    runs-on: ubuntu-latest
    needs: [init-status, loading, build, test, comment]
    if: always()
    steps:
      - name: Final workflow status
        if: inputs.sha != ''
        uses: qualcomm-linux/kernel-config/.github/actions/workflow_status@main
        with:
          sha: ${{ inputs.sha }}
          action_mode: ${{ needs.test.result != 'skipped' && needs.test.result || needs.build.result }}
          check_name: pre-merge
          repo: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.PAT }}
