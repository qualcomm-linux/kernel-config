name: pre_merge
run-name: "${{ inputs.pr != '' && inputs.pr != '0' && format('premerge: {0} - PR #{1}', inputs.repo, inputs.pr) || format('premerge: {0} @ {1}', inputs.repo, inputs.ref) }}"
on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number. Leave empty or 0 to build ref as-is.
        type: string
        required: false
        default: "0"
      sha:
        description: Commit SHA for status/check reporting.
        type: string
        required: true
      ref:
        description: Target branch/ref. With no PR, this ref is checked out and built as-is.
        type: string
        required: true
      repo:
        description: Target repository
        type: string
        required: true
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number. Leave empty or 0 to build ref as-is.
        type: string
        required: false
        default: "0"
      sha:
        description: Commit SHA for status/check reporting.
        type: string
        required: true
      ref:
        description: Target branch/ref. With no PR, this ref is checked out and built as-is.
        type: string
        required: true
      repo:
        description: Target repository
        type: string
        required: true

jobs:
  init-status:
    runs-on: ubuntu-latest
    steps:
      - name: Initial workflow status
        uses: qualcomm-linux/kernel-config/.github/actions/workflow_status@main
        with:
          sha: ${{ inputs.sha }}
          action_mode: start
          check_name: pre-merge
          repo: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.PAT }}

  loading:
    needs: [init-status]
    uses: ./.github/workflows/loading.yml
    secrets: inherit
    with:
      branch: ${{ inputs.ref }}

  build:
    needs: [loading, init-status]
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      docker_image: ${{ vars.TECH_TEAM_NAMESPACE }}/kmake-image:${{ vars.KMAKE_IMAGE_VERSION }}
      pr_number: ${{ inputs.pr }}
      branch: ${{ inputs.ref }}
      repo: ${{ inputs.repo }}
      rootfs_matrix: ${{ needs.loading.outputs.rootfs_matrix }}
      variant: default

  build_rt:
    needs: [loading, init-status]
    uses: ./.github/workflows/build_rt.yml
    secrets: inherit
    with:
      docker_image: ${{ vars.TECH_TEAM_NAMESPACE }}/kmake-image:${{ vars.KMAKE_IMAGE_VERSION }}
      pr_number: ${{ inputs.pr }}
      branch: ${{ inputs.ref }}
      repo: ${{ inputs.repo }}
      variant: RT

  check_run:
    runs-on: ubuntu-latest
    needs: [init-status, loading, build]
    steps:
      - name: Post check run
        uses: qualcomm-linux/kernel-config/.github/actions/check_run@main
        with:
          sha: ${{ inputs.sha }}
          repo: ${{ inputs.repo }}
          s3_location: ${{ needs.build.outputs.s3_location }}
          APPID: ${{ secrets.APPID }}
          PVK: ${{ secrets.PVK }}

  test:
    if: inputs.repo == 'qualcomm-linux/kernel'
    needs: [init-status, loading, build]
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      docker_image: ${{vars.TECH_TEAM_NAMESPACE}}/kmake-image:${{vars.KMAKE_IMAGE_VERSION}}
      rootfs_matrix: ${{ needs.loading.outputs.rootfs_matrix }}
      kernel_version: ${{ needs.build.outputs.kernel_version }}
      commit_SHA: ${{ inputs.sha }}
      branch: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr }}
      flash_type: ""
      build_type: "kbdev"

  comment:
    needs: [test]
    uses: ./.github/workflows/comment.yml
    if: always() && inputs.pr != '' && inputs.pr != '0' && needs.test.result != 'skipped'
    secrets: inherit
    with:
      pr_number: ${{ inputs.pr }}
      sha: ${{ inputs.sha }}
      repo: ${{ inputs.repo }}

  test-results:
    name: Evaluate pre-merge test results
    if: always() && needs.test.result != 'skipped'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4

      - name: Download LAVA result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Tests-*
          path: lava-results
          merge-multiple: true

      - name: Evaluate known failures
        id: result_summary
        uses: ./.github/actions/evaluate_lava_results
        with:
          known_failures_file: pre-merge-known-failures.yaml
          branch: ${{ inputs.ref }}

      - name: Post known failure summary on PR
        if: inputs.pr != '' && inputs.pr != '0' && steps.result_summary.outputs.has_failures == '1'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr }}
          TARGET_REPO: ${{ inputs.repo }}
          SUMMARY_FILE: ${{ steps.result_summary.outputs.summary_file }}
        with:
          github-token: ${{ secrets.PAT || github.token }}
          script: |
            const fs = require('fs');

            const [owner, repo] = process.env.TARGET_REPO.split('/');
            if (!owner || !repo) {
              core.setFailed(`Invalid target repository: ${process.env.TARGET_REPO}`);
              return;
            }

            const body = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Fail on unexpected failures or test workflow failure
        if: always() && (needs.test.result != 'success' || steps.result_summary.outputs.failed == '1')
        run: exit 1

  final-status:
    runs-on: ubuntu-latest
    needs: [init-status, loading, build, test, comment, test-results]
    if: always()
    steps:
      - name: Final workflow status
        uses: qualcomm-linux/kernel-config/.github/actions/workflow_status@main
        with:
          sha: ${{ inputs.sha }}
          action_mode: ${{ needs.test-results.result != 'skipped' && needs.test-results.result || (needs.test.result != 'skipped' && needs.test.result || needs.build.result) }}
          check_name: pre-merge
          repo: ${{ inputs.repo }}
          GH_TOKEN: ${{ secrets.PAT }}
